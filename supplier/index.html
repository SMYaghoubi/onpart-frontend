<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل تأمین‌کننده | آن‌پارت</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;font-family:Vazirmatn;color:#172033}.top{height:64px;background:#0f172a;color:#fff;display:flex;align-items:center;padding:0 24px;gap:14px}.top img{height:42px;background:#fff;border-radius:8px;padding:4px}.top .company{font-weight:700}.logout{margin-right:auto;border:0;border-radius:8px;padding:8px 12px;background:#ffffff18;color:#fff;font:12px Vazirmatn;cursor:pointer}.page{max-width:1200px;margin:auto;padding:22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat,.card{background:#fff;border-radius:14px;padding:17px;box-shadow:0 1px 4px #0001}.stat b{font-size:22px;color:#1d4ed8}.stat span{display:block;font-size:11px;color:#888}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.btn{border:0;border-radius:9px;padding:9px 14px;font:600 12.5px Vazirmatn;cursor:pointer;display:inline-flex;align-items:center;gap:5px;text-decoration:none}.blue{background:#1d4ed8;color:#fff}.green{background:#16a34a;color:#fff}.gray{background:#e9eef5;color:#475569}.search{flex:1;min-width:200px;border:1.5px solid #ddd;border-radius:9px;padding:9px 12px;font:13px Vazirmatn}.table-wrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;min-width:850px}.tbl th,.tbl td{padding:9px;border-bottom:1px solid #eee;font-size:12px;text-align:center}.tbl th{background:#f8fafc;color:#64748b}.price,.stock{width:120px;border:1px solid #dce2e8;border-radius:7px;padding:7px;text-align:center}.changed{background:#fff7ed!important;border-color:#fb923c!important}.status{padding:3px 8px;border-radius:15px;font-size:10.5px}.pending{background:#fef3c7;color:#a16207}.approved{background:#dcfce7;color:#15803d}.rejected{background:#fee2e2;color:#b91c1c}.history{margin-top:18px}.empty{text-align:center;padding:35px;color:#999}.note{font-size:11px;color:#777;margin:7px 0}.error-list{white-space:pre-line;background:#fff1f2;color:#be123c;border-radius:8px;padding:10px;font-size:11px;display:none}@media(max-width:650px){.page{padding:12px}.stats{grid-template-columns:1fr}.top{padding:0 12px}.top img{height:38px}}</style></head><body><header class="top"><img src="../images/logo.png" alt="آن‌پارت"><div><div class="company" id="company">پنل تأمین‌کننده</div><div style="font-size:10px;color:#94a3b8">مدیریت قیمت و موجودی مجاز</div></div><button class="logout" onclick="logout()"><i class="ti ti-logout"></i> خروج</button></header><main class="page"><section class="stats"><div class="stat"><b id="productCount">۰</b><span>محصول مجاز</span></div><div class="stat"><b id="changedCount">۰</b><span>تغییر آماده ارسال</span></div><div class="stat"><b id="pendingCount">۰</b><span>بسته در انتظار بررسی</span></div></section><section class="card"><div class="tools"><input class="search" id="search" placeholder="جستجوی کد، شرح یا برند..." oninput="render()"><button class="btn gray" onclick="downloadTemplate()"><i class="ti ti-download"></i> نمونه اکسل</button><button class="btn green" onclick="document.getElementById('excel').click()"><i class="ti ti-file-spreadsheet"></i> بارگذاری اکسل</button><input id="excel" type="file" accept=".xlsx,.xls,.csv" hidden onchange="readExcel(this)"><button class="btn blue" id="submitBtn" onclick="submitChanges('manual')"><i class="ti ti-send"></i> ارسال برای بررسی</button></div><div class="note">قیمت‌ها در این مرحله مستقیماً روی فروشگاه اعمال نمی‌شوند و پس از بررسی بازاریاب به‌روزرسانی خواهند شد.</div><div class="error-list" id="errors"></div><div class="table-wrap"><table class="tbl"><thead><tr><th>کد</th><th>شرح</th><th>برند</th><th>قیمت فعلی</th><th>قیمت تأمین‌کننده</th><th>موجودی فعلی</th><th>موجودی پیشنهادی</th></tr></thead><tbody id="tbody"></tbody></table></div></section><section class="card history"><h3 style="font-size:15px;margin-top:0">سوابق ارسالی</h3><div id="history"></div></section></main><script src="../js/api.js"></script><script>
const token=sessionStorage.getItem('op_supplier_token');if(!token)location.replace('login.html');const supplier=JSON.parse(sessionStorage.getItem('op_supplier')||'{}');document.getElementById('company').textContent=supplier.company||'پنل تأمین‌کننده';let products=[],changes=new Map(),batches=[];const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);const fmt=n=>fa(Number(n||0).toLocaleString());
async function sreq(path,options={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const res=await fetch(API.BASE_URL+path,{...options,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...(options.headers||{})},signal:controller.signal});const data=await res.json();if(!res.ok){const e=new Error(data.message||'خطا');e.data=data;throw e}return data}finally{clearTimeout(timer)}}
async function load(){try{const [p,b]=await Promise.all([sreq('/api/supplier-portal/products'),sreq('/api/supplier-portal/updates')]);products=p.products||[];batches=b.batches||[];document.getElementById('productCount').textContent=fa(products.length);document.getElementById('pendingCount').textContent=fa(batches.filter(x=>x.status==='pending').length);render();renderHistory()}catch(e){alert(e.message)}}
function render(){const q=document.getElementById('search').value.trim().toLowerCase(),rows=products.filter(p=>!q||[p.code,p.description,p.brand].some(v=>String(v||'').toLowerCase().includes(q)));const body=document.getElementById('tbody');if(!rows.length){body.innerHTML='<tr><td colspan="7" class="empty">محصول مجازی برای شما یافت نشد؛ با بازاریاب تماس بگیرید.</td></tr>';return}body.innerHTML=rows.map(p=>{const c=changes.get(p.id)||{};return `<tr><td style="font-family:monospace">${API.escapeHtml(p.code)}</td><td style="text-align:right">${API.escapeHtml(p.description)}</td><td>${API.escapeHtml(p.brand||'—')}</td><td>${fmt(p.price)}</td><td><input class="price ${c.supplier_price!=null?'changed':''}" inputmode="numeric" value="${c.supplier_price??''}" onchange="setChange(${p.id},'supplier_price',this.value,this)"></td><td>${fa(p.stock||0)}</td><td><input class="stock ${c.stock!=null?'changed':''}" inputmode="numeric" value="${c.stock??''}" placeholder="بدون تغییر" onchange="setChange(${p.id},'stock',this.value,this)"></td></tr>`}).join('')}
function setChange(id,key,value,input){const c=changes.get(id)||{};if(value==='')delete c[key];else c[key]=Number(String(value).replace(/[,٬]/g,''));if(Object.keys(c).length)changes.set(id,c);else changes.delete(id);input.classList.toggle('changed',value!=='');document.getElementById('changedCount').textContent=fa(changes.size)}
function collect(){const rows=[];for(const [id,c] of changes){const p=products.find(x=>x.id===id);if(p&&Number.isInteger(c.supplier_price)&&c.supplier_price>=0)rows.push({code:p.code,supplier_price:c.supplier_price,stock:c.stock??null})}return rows}
async function submitChanges(source,filename){const items=collect();if(!items.length){alert('حداقل قیمت یک محصول را وارد کنید');return}const btn=document.getElementById('submitBtn');btn.disabled=true;try{const d=await sreq('/api/supplier-portal/updates',{method:'POST',body:JSON.stringify({source,filename,items})});alert(d.message);changes.clear();document.getElementById('changedCount').textContent='۰';await load()}catch(e){showErrors(e.data?.errors||[e.message])}finally{btn.disabled=false}}
function showErrors(list){const el=document.getElementById('errors');el.textContent=list.join('\n');el.style.display='block'}
function downloadTemplate(){const rows=products.map(p=>({'کد محصول':p.code,'شرح محصول':p.description,'برند':p.brand||'','قیمت تامین کننده':'','موجودی پیشنهادی':''}));const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'قیمت‌ها');XLSX.writeFile(wb,'onpart-supplier-template.xlsx')}
function readExcel(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});changes.clear();const errors=[];rows.forEach((r,i)=>{const code=String(r['کد محصول']??r.code??'').trim(),price=Number(String(r['قیمت تامین کننده']??r.supplier_price??'').replace(/[,٬]/g,'')),stockRaw=r['موجودی پیشنهادی']??r.stock??'';const p=products.find(x=>String(x.code).trim()===code);if(!p||!Number.isInteger(price)||price<0){errors.push(`ردیف ${i+2}: کد یا قیمت نامعتبر`);return}const c={supplier_price:price};if(stockRaw!==''){const st=Number(stockRaw);if(!Number.isInteger(st)||st<0){errors.push(`ردیف ${i+2}: موجودی نامعتبر`);return}c.stock=st}changes.set(p.id,c)});document.getElementById('changedCount').textContent=fa(changes.size);render();if(errors.length)showErrors(errors);else if(confirm(`${changes.size} ردیف آماده است. اکنون ارسال شود؟`))submitChanges('excel',file.name)}catch(err){showErrors(['فایل اکسل قابل خواندن نیست'])}};reader.readAsArrayBuffer(file);input.value=''}
function renderHistory(){const labels={pending:'در انتظار بررسی',approved:'تأیید شده',rejected:'رد شده'};document.getElementById('history').innerHTML=batches.length?batches.map(b=>`<div style="display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #eee;font-size:12px"><b>#${fa(b.id)}</b><span>${b.source==='excel'?'اکسل':'دستی'} · ${fa(b.item_count)} محصول</span><span class="status ${b.status}" style="margin-right:auto">${labels[b.status]}</span>${b.markup_percent!=null?`<span>افزایش ${fa(b.markup_percent)}٪</span>`:''}</div>`).join(''):'<div class="empty">هنوز تغییری ارسال نشده است.</div>'}
function logout(){sessionStorage.removeItem('op_supplier_token');sessionStorage.removeItem('op_supplier');location.replace('login.html')}load();</script></body></html>
