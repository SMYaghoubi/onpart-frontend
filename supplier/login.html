<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود تأمین‌کنندگان | آن‌پارت</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eff6ff,#f8fafc);font-family:Vazirmatn;min-height:100vh;display:grid;place-items:center;padding:18px}.box{width:min(420px,100%);background:#fff;border-radius:20px;padding:28px;box-shadow:0 20px 60px #1e3a8a20}.logo{height:58px;display:block;margin:0 auto 18px}.title{text-align:center;font-size:20px;font-weight:800}.sub{text-align:center;color:#777;font-size:12.5px;margin:6px 0 22px}.field{width:100%;border:1.5px solid #dbe2ea;border-radius:11px;padding:12px;font:14px Vazirmatn;outline:none;margin-bottom:12px}.field:focus{border-color:#1d4ed8}.btn{width:100%;border:0;border-radius:11px;padding:12px;background:#1d4ed8;color:#fff;font:700 14px Vazirmatn;cursor:pointer}.btn:disabled{opacity:.55}.otp{display:none}.msg{font-size:12px;margin:10px 0;color:#dc2626;text-align:center;min-height:18px}.back{display:block;text-align:center;color:#777;font-size:12px;margin-top:18px;text-decoration:none}body:before,body:after{content:"";position:fixed;width:360px;height:360px;border-radius:50%;filter:blur(4px);opacity:.32;z-index:-1;animation:floatBg 9s ease-in-out infinite;background:radial-gradient(circle,#60a5fa,transparent 68%)}body:before{top:-120px;right:-100px}body:after{bottom:-140px;left:-90px;animation-delay:-4s;background:radial-gradient(circle,#34d399,transparent 68%)}.box{border:1px solid #ffffffaa;backdrop-filter:blur(12px)}.btn{transition:transform .2s,box-shadow .2s}.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 24px #1d4ed840}.btn:focus-visible,.field:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.btn.loading{cursor:wait}.btn.loading:after{content:"";width:15px;height:15px;border:2px solid #fff8;border-top-color:#fff;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle;animation:spin .7s linear infinite}@keyframes floatBg{50%{transform:translate3d(30px,24px,0) scale(1.08)}}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:480px){.box{padding:22px 18px;border-radius:16px}.title{font-size:18px}}@media(prefers-reduced-motion:reduce){body:before,body:after,.btn.loading:after{animation:none}.btn{transition:none}}</style></head><body><div class="box"><img class="logo" src="../images/logo.png" alt="آن‌پارت"><div class="title">پنل تأمین‌کنندگان</div><div class="sub">ورود با شماره ثبت‌شده در فرم همکاری</div><div id="phoneStep"><input class="field" id="phone" dir="ltr" inputmode="numeric" placeholder="09xxxxxxxxx"><button class="btn" id="sendBtn" onclick="sendOtp()">ارسال کد ورود</button></div><div class="otp" id="otpStep"><input class="field" id="code" dir="ltr" inputmode="numeric" maxlength="5" placeholder="کد پنج‌رقمی"><button class="btn" id="verifyBtn" onclick="verifyOtp()">ورود به پنل</button><button class="btn" style="background:#eef2f7;color:#555;margin-top:8px" onclick="backPhone()">اصلاح شماره</button></div><div class="msg" id="msg"></div><a class="back" href="/cooperation.html">ثبت درخواست همکاری</a></div><script src="../js/api.js"></script><script>
if(sessionStorage.getItem('op_supplier_token'))location.replace('index.html');const msg=t=>document.getElementById('msg').textContent=t||'';
async function sendOtp(){const phone=document.getElementById('phone').value.trim();const btn=document.getElementById('sendBtn');msg('');btn.disabled=true;btn.classList.add('loading');try{await API.request('/api/supplier-portal/auth/send-otp',{method:'POST',body:JSON.stringify({phone})});document.getElementById('phoneStep').style.display='none';document.getElementById('otpStep').style.display='block';document.getElementById('code').focus()}catch(e){msg(e.message)}finally{btn.disabled=false;btn.classList.remove('loading')}}
async function verifyOtp(){const phone=document.getElementById('phone').value.trim(),code=document.getElementById('code').value.trim(),btn=document.getElementById('verifyBtn');msg('');btn.disabled=true;btn.classList.add('loading');try{const data=await API.request('/api/supplier-portal/auth/verify-otp',{method:'POST',body:JSON.stringify({phone,code})});sessionStorage.setItem('op_supplier_token',data.token);sessionStorage.setItem('op_supplier',JSON.stringify(data.supplier));location.replace('index.html')}catch(e){msg(e.message)}finally{btn.disabled=false;btn.classList.remove('loading')}}
function backPhone(){document.getElementById('phoneStep').style.display='block';document.getElementById('otpStep').style.display='none';msg('')}
document.addEventListener('keydown',e=>{if(e.key==='Enter')(document.getElementById('otpStep').style.display==='block'?verifyOtp():sendOtp())});</script></body></html>
