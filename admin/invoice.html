<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فاکتور آن‌پارت</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#172033;font-family:Vazirmatn,sans-serif}.actions{max-width:210mm;margin:18px auto 8px;display:flex;gap:8px}.btn{border:0;border-radius:9px;padding:10px 16px;background:#1d4ed8;color:#fff;font:700 13px Vazirmatn;cursor:pointer}.btn.back{background:#475569}.sheet{width:210mm;min-height:297mm;margin:0 auto 24px;background:#fff;padding:15mm;box-shadow:0 8px 30px #0f172a18}.head{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #1d4ed8;padding-bottom:12px}.logo{max-width:120px;max-height:64px}.seller{text-align:left;font-size:11px;line-height:1.9}.title{text-align:center;font-size:22px;font-weight:800;margin:18px}.meta,.totals{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;background:#f8fafc;border-radius:10px;padding:12px;font-size:12px}.tbl{width:100%;border-collapse:collapse;margin:16px 0}.tbl th,.tbl td{border:1px solid #dbe2ea;padding:8px;text-align:center;font-size:11px}.tbl th{background:#eff6ff}.totals{margin-right:auto;width:55%;grid-template-columns:1fr 1fr}.grand{font-size:15px;font-weight:800;color:#1d4ed8}.notes{margin-top:18px;border:1px solid #e2e8f0;border-radius:10px;padding:12px;min-height:65px;font-size:12px}.sign{display:flex;justify-content:space-between;margin-top:45px;text-align:center;font-size:12px}.error,.loading{text-align:center;padding:80px;color:#64748b}@media(max-width:800px){.sheet{width:100%;min-height:auto;padding:18px}.actions{padding:0 12px}.meta{grid-template-columns:1fr}.totals{width:100%}.tbl{display:block;overflow:auto}}@media print{@page{size:A4;margin:0}body{background:#fff}.actions{display:none}.sheet{margin:0;box-shadow:none;width:210mm;min-height:297mm}.tbl{display:table;overflow:visible}}
</style></head><body><div class="actions"><button class="btn" onclick="window.print()">چاپ / ذخیره PDF</button><button class="btn back" onclick="goBack()">بازگشت</button></div><main class="sheet" id="invoice"><div class="loading">در حال دریافت اطلاعات فاکتور...</div></main><script src="../js/api.js"></script><script>
function goBack(){try{const ref=document.referrer?new URL(document.referrer):null;if(history.length>1&&ref&&ref.origin===location.origin&&ref.pathname.startsWith('/admin/')){history.back();return}}catch(_){}location.href='/admin/orders'}
function invoiceError(root,message,loginRequired){root.innerHTML='<div class="error"><b>'+API.escapeHtml(message)+'</b><div style="margin-top:18px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn" onclick="loadInvoice()">تلاش دوباره</button>'+(loginRequired?'<a class="btn back" href="/admin/login" style="text-decoration:none">ورود مدیریت</a>':'')+'<button class="btn back" onclick="goBack()">بازگشت به سفارش‌ها</button></div></div>'}
const esc=value=>API.escapeHtml(value==null?'':value),fmt=value=>Number(value||0).toLocaleString('fa-IR'),dateFa=value=>value?new Date(value).toLocaleDateString('fa-IR'):'—';
const payLabel={pending:'در انتظار بررسی',approved:'پرداخت تأیید شد',rejected:'پرداخت رد شد'};
async function loadInvoice(){const id=new URLSearchParams(location.search).get('id'),root=document.getElementById('invoice');if(!/^\d+$/.test(id||'')){invoiceError(root,'شماره سفارش نامعتبر است.',false);return}let user={};try{user=JSON.parse(sessionStorage.getItem('op_user')||'{}')}catch(_){}const token=sessionStorage.getItem('op_token');if(!token||!['admin','partner'].includes(user.role)){invoiceError(root,'نشست مدیریت در این صفحه در دسترس نیست. از پنل مدیریت دوباره فاکتور را باز کنید.',true);return}root.innerHTML='<div class="loading">در حال دریافت اطلاعات فاکتور...</div>';try{const data=await API.request('/api/orders/'+id+'/invoice'),o=data.order,s=data.settings||{},items=data.items||[],subtotal=items.reduce((sum,i)=>sum+Number(i.quantity||0)*Number(i.price||0),0),discount=Math.max(0,subtotal-Number(o.total||0));root.innerHTML='<header class="head"><img class="logo" src="'+esc(s.invoice_logo||'../images/logo.png')+'" alt="لوگو"><div class="seller"><b>'+esc(s.site_name||'آن‌پارت')+'</b><br>'+esc(s.site_address||'')+'<br>'+esc(s.site_phone||'')+'</div></header><h1 class="title">فاکتور فروش</h1><section class="meta"><div>شماره سفارش: <b>#'+fmt(o.id)+'</b></div><div>تاریخ: <b>'+dateFa(o.created_at)+'</b></div><div>مشتری: <b>'+esc(o.user_name||'—')+'</b></div><div>تلفن: <b>'+esc(o.user_phone||'—')+'</b></div><div style="grid-column:1/-1">آدرس: <b>'+esc((o.user_city||'')+' '+(o.user_address||''))+'</b></div></section><table class="tbl"><thead><tr><th>ردیف</th><th>کد</th><th>شرح</th><th>تعداد</th><th>قیمت واحد</th><th>تخفیف</th><th>جمع</th></tr></thead><tbody>'+items.map((i,n)=>'<tr><td>'+fmt(n+1)+'</td><td>'+esc(i.code||'—')+'</td><td style="text-align:right">'+esc(i.description||'—')+'</td><td>'+fmt(i.quantity)+'</td><td>'+fmt(i.price)+'</td><td>'+fmt(i.discount||0)+'٪</td><td>'+fmt(i.total)+'</td></tr>').join('')+'</tbody></table><section class="totals"><span>جمع جزء</span><b>'+fmt(subtotal)+' تومان</b><span>تخفیف</span><b>'+fmt(discount)+' تومان</b><span class="grand">مبلغ نهایی</span><b class="grand">'+fmt(o.total)+' تومان</b><span>وضعیت پرداخت</span><b>'+esc(payLabel[o.payment_status]||'بدون پرداخت')+'</b><span>روش ارسال</span><b>'+esc(o.shipping_method||'—')+'</b></section><div class="notes"><b>توضیحات:</b><br>'+esc(o.note||'—')+'</div><div class="sign"><span>مهر و امضای فروشنده<br><br>........................</span><span>امضای خریدار<br><br>........................</span></div>'}catch(e){invoiceError(root,e.status===401||e.status===403?'نشست مدیریت منقضی شده یا مجوز مشاهده این فاکتور را ندارید.':(e.message||'خطا در دریافت فاکتور'),e.status===401||e.status===403)}}
loadInvoice();
</script></body></html>
