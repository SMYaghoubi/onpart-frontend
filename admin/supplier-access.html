<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دسترسی تأمین‌کننده | آن‌پارت</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"><link rel="stylesheet" href="../css/style.css">
<style>body{background:#f1f5f9}.card{background:#fff;border-radius:15px;padding:20px;box-shadow:0 1px 5px #0001;max-width:850px}.title{font-size:18px;font-weight:800;margin-bottom:6px}.muted{font-size:12px;color:#777}.switch-row{display:flex;gap:10px;align-items:center;background:#f8fafc;padding:13px;border-radius:10px;margin:18px 0}.brands{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:430px;overflow:auto}.brand{display:flex;gap:7px;align-items:center;padding:9px;border:1px solid #e5e7eb;border-radius:8px;font-size:12px}.brand-count{margin-right:auto;background:#eff6ff;color:#1d4ed8;border-radius:12px;padding:2px 7px;font-size:10px}.empty-brands{grid-column:1/-1;padding:22px;text-align:center;color:#777;background:#f8fafc;border-radius:10px}.actions{display:flex;gap:8px;margin-top:18px}.btn{border:0;border-radius:9px;padding:10px 18px;font:600 13px Vazirmatn;cursor:pointer}.primary{background:#1d4ed8;color:#fff}.secondary{background:#e5e7eb;color:#333}.search{width:100%;box-sizing:border-box;padding:10px 12px;border:1.5px solid #ddd;border-radius:9px;font:13px Vazirmatn;margin:12px 0}@media(max-width:650px){.brands{grid-template-columns:1fr 1fr}}</style></head>
<body><div class="layout"><div id="sidebar-placeholder"></div><main class="main"><div id="topbar-placeholder"></div><div class="content"><div class="card">
<div class="title">تعیین دسترسی محصولات تأمین‌کننده</div><div class="muted">پس از ذخیره، ورود پیامکی پنل برای تأمین‌کننده فعال می‌شود.</div>
<label class="switch-row"><input type="checkbox" id="assignedCompany"><span><b>محصولات متصل به همین تأمین‌کننده</b><br><span class="muted">محصولاتی که در پنل محصولات، این شرکت به‌عنوان تأمین‌کننده آن‌ها انتخاب شده است.</span></span></label>
<div style="font-weight:700;font-size:14px">برندهای مجاز از روی محصولات</div><div class="muted">برند از ستون «برند» در پنل محصولات خوانده می‌شود. برای افزودن برند جدید، ابتدا آن را روی حداقل یک محصول فعال ثبت کنید.</div><input class="search" id="brandSearch" placeholder="جستجوی برند محصولات..." oninput="renderBrands()"><div class="brands" id="brands"></div>
<div class="actions"><button class="btn primary" id="saveBtn" onclick="saveScopes()"><i class="ti ti-check"></i> ذخیره و فعال‌سازی پنل</button><a class="btn secondary" href="partners.html" style="text-decoration:none">بازگشت</a></div>
</div></div></main></div><script src="../js/api.js"></script><script src="../js/admin.js"></script><script>
Admin.renderSidebar('partners');Admin.renderTopbar('دسترسی تأمین‌کننده','ti-key');
const supplierId=Number(new URLSearchParams(location.search).get('supplier'));let allBrands=[],selected=new Set();
if(!supplierId){Admin.toast('شناسه تأمین‌کننده نامعتبر است','error');}
async function load(){try{const [options,current]=await Promise.all([API.request('/api/supplier-portal/admin/scope-options'),API.request(`/api/supplier-portal/admin/suppliers/${supplierId}/scopes`)]);allBrands=options.brands||[];(current.scopes||[]).forEach(s=>{if(s.scope_type==='brand')selected.add(s.scope_value);if(s.scope_type==='assigned_company')document.getElementById('assignedCompany').checked=true});renderBrands()}catch(e){Admin.toast(e.message,'error')}}
function renderBrands(){const q=document.getElementById('brandSearch').value.trim().toLowerCase();const root=document.getElementById('brands');root.replaceChildren();const rows=allBrands.filter(item=>!q||String(item.brand||'').toLowerCase().includes(q));if(!rows.length){const empty=document.createElement('div');empty.className='empty-brands';empty.textContent=allBrands.length?'برندی مطابق جستجو یافت نشد.':'هنوز روی محصولات فعال، برندی ثبت نشده است.';root.append(empty);return}rows.forEach(item=>{const brand=String(item.brand||'');const label=document.createElement('label');label.className='brand';const cb=document.createElement('input');cb.type='checkbox';cb.checked=selected.has(brand);cb.onchange=()=>cb.checked?selected.add(brand):selected.delete(brand);const count=document.createElement('span');count.className='brand-count';count.textContent=`${String(item.product_count||0).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])} محصول`;label.append(cb,document.createTextNode(brand),count);root.append(label)})}
async function saveScopes(){const btn=document.getElementById('saveBtn');btn.disabled=true;try{await API.request(`/api/supplier-portal/admin/suppliers/${supplierId}/scopes`,{method:'PUT',body:JSON.stringify({assigned_company:document.getElementById('assignedCompany').checked,brands:[...selected]})});Admin.toast('دسترسی ذخیره و پنل فعال شد')}catch(e){Admin.toast(e.message,'error')}finally{btn.disabled=false}}
load();</script></body></html>
