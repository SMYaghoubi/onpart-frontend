<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" href="/images/favicon.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ارسال پیامک | آن‌پارت</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    body{background:#f1f5f9;}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
    .card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
    .card-title{font-size:15px;font-weight:800;color:#111;display:flex;align-items:center;gap:8px;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid #f0f0f0;}
    .card-title i{color:#1d4ed8;}
    .fg{margin-bottom:16px;}
    .flabel{font-size:12.5px;font-weight:600;color:#444;margin-bottom:7px;display:block;}
    .finput{width:100%;background:#f8fafc;border:1.5px solid #e5e7eb;border-radius:9px;padding:10px 13px;font-family:'Vazirmatn',sans-serif;font-size:13.5px;color:#111;outline:none;transition:border .2s;}
    .finput:focus{border-color:#1d4ed8;background:#fff;}
    .fselect{width:100%;background:#f8fafc;border:1.5px solid #e5e7eb;border-radius:9px;padding:10px 13px;font-family:'Vazirmatn',sans-serif;font-size:13px;color:#333;outline:none;cursor:pointer;}
    .ftextarea{width:100%;background:#f8fafc;border:1.5px solid #e5e7eb;border-radius:9px;padding:10px 13px;font-family:'Vazirmatn',sans-serif;font-size:13px;color:#111;outline:none;resize:none;}
    .btn-send{background:#1d4ed8;color:#fff;border:none;border-radius:9px;padding:12px 28px;font-family:'Vazirmatn',sans-serif;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px;}
    .btn-test{background:#f0fdf4;color:#16a34a;border:1.5px solid #bbf7d0;border-radius:9px;padding:10px 20px;font-family:'Vazirmatn',sans-serif;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;}
    .counter{font-size:12px;color:#aaa;text-align:left;margin-top:4px;}
    .template-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
    .template-item{background:#f8fafc;border:1.5px solid #e5e7eb;border-radius:10px;padding:12px 14px;cursor:pointer;transition:all .15s;}
    .template-item:hover{border-color:#1d4ed8;background:#eff6ff;}
    .template-name{font-size:13px;font-weight:600;color:#111;margin-bottom:4px;}
    .template-preview{font-size:11.5px;color:#888;line-height:1.5;}
    .stat-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f0f0f0;}
    .stat-row:last-child{border-bottom:none;}
    .stat-label{font-size:13px;color:#444;display:flex;align-items:center;gap:8px;}
    .stat-val{font-size:14px;font-weight:700;color:#111;}
    .log-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0;}
    .log-item:last-child{border-bottom:none;}
    .log-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
    .li-ok{background:#dcfce7;color:#16a34a;} .li-fail{background:#fee2e2;color:#dc2626;}
    .log-phone{font-size:12.5px;font-weight:600;color:#111;direction:ltr;}
    .log-text{font-size:11.5px;color:#888;margin-top:2px;}
    .log-time{font-size:11px;color:#bbb;margin-right:auto;flex-shrink:0;}
    .badge{border-radius:6px;padding:3px 9px;font-size:11px;font-weight:600;}
    .b-green{background:#dcfce7;color:#16a34a;} .b-red{background:#fee2e2;color:#dc2626;}
    .api-status{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:9px;margin-bottom:14px;}
    .api-ok{background:#dcfce7;} .api-fail{background:#fee2e2;}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;border-radius:12px;padding:12px 24px;font-size:14px;font-weight:600;display:none;align-items:center;gap:10px;z-index:999;}
    .toast.show{display:flex;}
  </style>
</head>
<body>
<div class="layout">
  <div id="sidebar-placeholder"></div>
  <div class="main">
    <div id="topbar-placeholder"></div>
    <div class="content">

      <div class="grid2">
        <!-- SEND SMS -->
        <div class="card">
          <div class="card-title"><i class="ti ti-send"></i>ارسال پیامک</div>

          <div class="fg">
            <label class="flabel">گیرندگان</label>
            <select class="fselect" id="recipients">
              <option value="all_users">همه کاربران فعال</option>
              <option value="all_partners">همه همکاران</option>
              <option value="debtors">کاربران بدهکار</option>
              <option value="pending_orders">سفارش در انتظار</option>
              <option value="custom">شماره دستی</option>
            </select>
          </div>

          <div class="fg" id="customPhoneWrap" style="display:none">
            <label class="flabel">شماره موبایل (جداشده با کاما)</label>
            <input class="finput" id="customPhone" placeholder="09121234567, 09351234567"/>
          </div>

          <div class="fg">
            <label class="flabel">متن پیامک</label>
            <textarea class="ftextarea" id="smsText" rows="4" placeholder="متن پیامک..." oninput="updateCounter()"></textarea>
            <div class="counter" id="smsCounter">۰ کاراکتر</div>
          </div>

          <div style="margin-bottom:16px">
            <label class="flabel">قالب‌های آماده</label>
            <div class="template-grid">
              <div class="template-item" onclick="setTemplate('order')">
                <div class="template-name">تأیید سفارش</div>
                <div class="template-preview">سفارش شما تأیید شد...</div>
              </div>
              <div class="template-item" onclick="setTemplate('payment')">
                <div class="template-name">یادآوری پرداخت</div>
                <div class="template-preview">مبلغ بدهی شما...</div>
              </div>
              <div class="template-item" onclick="setTemplate('welcome')">
                <div class="template-name">خوش‌آمدگویی</div>
                <div class="template-preview">به آن‌پارت خوش آمدید...</div>
              </div>
              <div class="template-item" onclick="setTemplate('offer')">
                <div class="template-name">پیشنهاد ویژه</div>
                <div class="template-preview">تخفیف ویژه برای شما...</div>
              </div>
            </div>
          </div>

          <div style="display:flex;gap:10px">
            <button class="btn-send" onclick="sendSMS()"><i class="ti ti-send"></i>ارسال پیامک</button>
            <button class="btn-test" onclick="sendTest()"><i class="ti ti-flask"></i>ارسال تست</button>
          </div>
        </div>

        <!-- SETTINGS + STATS -->
        <div style="display:flex;flex-direction:column;gap:16px">
          <div class="card">
            <div class="card-title"><i class="ti ti-settings"></i>تنظیمات sms.ir</div>
            <div id="apiStatus" class="api-status api-fail">
              <i class="ti ti-alert-circle" style="color:#dc2626;font-size:18px"></i>
              <span style="font-size:13px;color:#dc2626;font-weight:600">API Key تنظیم نشده</span>
            </div>
            <div class="fg">
              <label class="flabel">API Key — sms.ir</label>
              <input class="finput" id="smsApiKey" placeholder="کلید API از پنل sms.ir"/>
            </div>
            <div class="fg">
              <label class="flabel">شماره خط پیامک</label>
              <input class="finput" id="smsLine" placeholder="50003XXXXXXX" style="direction:ltr"/>
            </div>
            <div style="display:flex;gap:8px">
              <button class="btn-send" style="flex:1;justify-content:center" onclick="saveApiSettings()"><i class="ti ti-check"></i>ذخیره تنظیمات</button>
              <button style="background:#f0fdf4;color:#16a34a;border:none;border-radius:9px;padding:10px 16px;font-family:Vazirmatn,sans-serif;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px" onclick="testSMS()"><i class="ti ti-flask"></i>تست</button>
            </div>
          </div>

          <div class="card">
            <div class="card-title"><i class="ti ti-chart-bar"></i>آمار پیامک</div>
            <div class="stat-row"><span class="stat-label"><i class="ti ti-send" style="color:#1d4ed8"></i>ارسال شده امروز</span><span class="stat-val" id="todaySent">—</span></div>
            <div class="stat-row"><span class="stat-label"><i class="ti ti-calendar" style="color:#16a34a"></i>ارسال شده این ماه</span><span class="stat-val" id="monthSent">—</span></div>
            <div class="stat-row"><span class="stat-label"><i class="ti ti-x" style="color:#dc2626"></i>ناموفق</span><span class="stat-val" id="failedSent">—</span></div>
          </div>
        </div>
      </div>

      <!-- LOGS -->
      <div class="card">
        <div class="card-title"><i class="ti ti-list"></i>آخرین پیامک‌های ارسالی</div>
        <div id="logList">
          <div style="text-align:center;padding:30px;color:#aaa">در حال بارگذاری...</div>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../js/api.js"></script>
<script src="../js/admin.js"></script>
<script>

function toJalali(dateStr){
  if(!dateStr) return '—';
  try{
    const d=new Date(dateStr);if(isNaN(d))return dateStr;
    const gy=d.getFullYear(),gm=d.getMonth()+1,gd=d.getDate();
    let jy=gy-1600,jm=0,jd=0,g_d_no,j_d_no,j_np,i;
    const g_d_m=[31,28,31,30,31,30,31,31,30,31,30,31];
    const j_d_m=[31,31,31,31,31,31,30,30,30,30,30,29];
    let gy2=gy-1600;
    g_d_no=365*gy2+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400);
    for(i=0;i<gm-1;i++)g_d_no+=g_d_m[i];
    if(gm>2&&((gy2%4===0&&gy2%100!==0)||(gy2%400===0)))g_d_no++;
    g_d_no+=gd;j_d_no=g_d_no-79;
    j_np=Math.floor(j_d_no/12053);j_d_no%=12053;
    jy=979+33*j_np+4*Math.floor(j_d_no/1461);j_d_no%=1461;
    if(j_d_no>=366){jy+=Math.floor((j_d_no-1)/365);j_d_no=(j_d_no-1)%365;}
    for(i=0;i<11&&j_d_no>=j_d_m[i];i++)j_d_no-=j_d_m[i];
    jm=i+1;jd=j_d_no+1;
    const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
    return fa(jy)+'/'+fa(String(jm).padStart(2,'0'))+'/'+fa(String(jd).padStart(2,'0'));
  }catch(e){return dateStr||'—';}
}

Admin.renderSidebar('sms');
Admin.renderTopbar('ارسال پیامک','ti-message-2');

const fa=n=>n.toString().replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);

function toast(msg,ok=true){
  const t=document.getElementById('toast');
  t.innerHTML=`<i class="ti ti-${ok?'check':'x'}" style="color:${ok?'#4ade80':'#f87171'};font-size:18px"></i>${msg}`;
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);
}

document.getElementById('recipients').addEventListener('change',function(){
  document.getElementById('customPhoneWrap').style.display=this.value==='custom'?'block':'none';
});

function updateCounter(){
  const t=document.getElementById('smsText').value;
  document.getElementById('smsCounter').textContent=fa(t.length)+' کاراکتر — '+fa(Math.ceil(t.length/70))+' پیام';
}

const templates={
  order:'سفارش شما در آن‌پارت تأیید شد. با تشکر از خرید شما. onpart.ir',
  payment:'کاربر گرامی، مبلغ بدهی شما به آن‌پارت سررسید شده است. لطفاً پرداخت فرمایید. onpart.ir',
  welcome:'به آن‌پارت خوش آمدید! از این پس می‌توانید قطعات یدکی مورد نیاز خود را از ما تهیه کنید. onpart.ir',
  offer:'پیشنهاد ویژه آن‌پارت: تخفیف ۱۰٪ برای خریدهای بالای ۵ میلیون تومان. onpart.ir',
};

function setTemplate(key){
  document.getElementById('smsText').value=templates[key];
  updateCounter();
}

async function sendSMS(){
  const text=document.getElementById('smsText').value.trim();
  const recipients=document.getElementById('recipients').value;
  if(!text){toast('متن پیامک خالی است',false);return;}

  try {
    const token=OnPartSession.getToken('admin');
    const phones=recipients==='custom'?document.getElementById('customPhone').value.split(',').map(p=>p.trim()):null;
    const body={message:text,recipients:phones||recipients};
    const res=await fetch(`${API.BASE_URL}/api/sms/send`,{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body:JSON.stringify(body)
    });
    const data=await res.json();
    if(res.ok && data.sent>0){
      toast(`پیامک به ${fa(data.sent)} نفر ارسال شد`);
    } else {
      toast(data.message||'ارسال ناموفق بود',false);
    }
    loadLogs();
  } catch(e){ toast('خطا در ارتباط با سرور پیامک',false); }
}

async function sendTest(){
  const text=document.getElementById('smsText').value.trim();
  if(!text){toast('متن پیامک خالی است',false);return;}
  const adminPhone = JSON.parse(OnPartSession.getUserRaw('admin')||'{}').phone || '';
  const testPhone = prompt('شماره موبایل برای ارسال تست:', adminPhone);
  if(!testPhone) return;
  try {
    const token=OnPartSession.getToken('admin');
    const res=await fetch(`${API.BASE_URL}/api/sms/send`,{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body:JSON.stringify({message:text,recipients:[testPhone]})
    });
    const data=await res.json();
    if(res.ok && data.sent>0) toast(`پیامک تست به ${testPhone} ارسال شد ✓`);
    else toast(data.message||'ارسال ناموفق بود — لاگ‌ها را بررسی کنید',false);
    loadLogs();
  } catch(e){ toast('خطا در ارسال پیامک',false); }
}

async function saveApiSettings(){
  const key=document.getElementById('smsApiKey').value.trim();
  const line=document.getElementById('smsLine').value.trim();
  if(!key){toast('API Key خالی است',false);return;}
  try {
    const token=OnPartSession.getToken('admin');
    const res=await fetch(`${API.BASE_URL}/api/settings`,{
      method:'PUT',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body:JSON.stringify({sms_api_key:key,sms_line:line})
    });
    const data=await res.json();
    if(!res.ok) throw new Error(data.message||data.error||'خطا');
    document.getElementById('apiStatus').className='api-status api-ok';
    document.getElementById('apiStatus').innerHTML='<i class="ti ti-check" style="color:#16a34a;font-size:18px"></i><span style="font-size:13px;color:#16a34a;font-weight:600">sms.ir متصل ✓</span>';
    toast('تنظیمات پیامک ذخیره شد');
  } catch(e){ toast(e.message||'خطا در ذخیره',false); }
}

async function testSMS(){
  const adminPhone = JSON.parse(OnPartSession.getUserRaw('admin')||'{}').phone || '';
  const testPhone = prompt('شماره موبایل برای تست:', adminPhone);
  if(!testPhone) return;
  try {
    const token=OnPartSession.getToken('admin');
    const res=await fetch(`${API.BASE_URL}/api/sms/send`,{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body:JSON.stringify({message:'پیامک تست آن‌پارت - سیستم پیامک فعال است ✓',recipients:[testPhone]})
    });
    const data=await res.json();
    if(res.ok) toast(`پیامک تست به ${testPhone} ارسال شد ✓`);
    else toast(data.message||'خطا در ارسال',false);
  } catch(e){ toast('خطا در ارسال',false); }
}

async function loadSettings(){
  try {
    const token=OnPartSession.getToken('admin');
    const res=await fetch(`${API.BASE_URL}/api/settings/admin`,{headers:{'Authorization':'Bearer '+token}});
    if(!res.ok) return;
    const data=await res.json();
    if(data.sms_api_key){
      document.getElementById('smsApiKey').value=data.sms_api_key;
      document.getElementById('smsLine').value=data.sms_line||'';
    }

    // Check real SMS connection status (based on server env vars)
    const statusRes=await fetch(`${API.BASE_URL}/api/sms/status`,{headers:{'Authorization':'Bearer '+token}});
    const status=await statusRes.json();
    if(status.configured){
      document.getElementById('apiStatus').className='api-status api-ok';
      document.getElementById('apiStatus').innerHTML='<i class="ti ti-check" style="color:#16a34a;font-size:18px"></i><span style="font-size:13px;color:#16a34a;font-weight:600">sms.ir متصل ✓ (خط '+(status.line||'')+')</span>';
      if(!document.getElementById('smsLine').value) document.getElementById('smsLine').value=status.line||'';
    } else {
      document.getElementById('apiStatus').className='api-status api-fail';
      document.getElementById('apiStatus').innerHTML='<i class="ti ti-alert-circle" style="color:#dc2626;font-size:18px"></i><span style="font-size:13px;color:#dc2626;font-weight:600">API Key تنظیم نشده</span>';
    }
  } catch(e){
    document.getElementById('apiStatus').innerHTML='<i class="ti ti-alert-circle" style="color:#dc2626;font-size:18px"></i><span style="font-size:13px;color:#dc2626;font-weight:600">API Key تنظیم نشده</span>';
  }
}

async function loadLogs(){
  try {
    const token=OnPartSession.getToken('admin');
    const res=await fetch(`${API.BASE_URL}/api/sms/logs`,{headers:{'Authorization':'Bearer '+token}});
    const logs=await res.json();
    document.getElementById('logList').innerHTML=logs.slice(0,20).map(l=>`
      <div class="log-item" style="flex-wrap:wrap">
        <div class="log-icon ${l.status==='sent'?'li-ok':'li-fail'}"><i class="ti ti-${l.status==='sent'?'check':'x'}"></i></div>
        <div style="flex:1;min-width:0">
          <div class="log-phone">${l.phone}</div>
          <div class="log-text" style="white-space:pre-wrap;word-break:break-word;font-size:12px;color:#555;margin-top:4px">${l.message||'—'}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0">
          <span class="badge ${l.status==='sent'?'b-green':'b-red'}">${l.status==='sent'?'ارسال شد':'ناموفق'}</span>
          <div class="log-time" style="direction:ltr">${API.formatDate(l.created_at,{withTime:true})}</div>
        </div>
      </div>`).join('')||'<div style="text-align:center;padding:20px;color:#aaa">پیامکی ارسال نشده</div>';

    document.getElementById('todaySent').textContent=fa(logs.filter(l=>l.status==='sent').length);
    document.getElementById('monthSent').textContent=fa(logs.length);
    document.getElementById('failedSent').textContent=fa(logs.filter(l=>l.status==='failed').length);
  } catch(e){
    document.getElementById('logList').innerHTML='<div style="text-align:center;padding:20px;color:#aaa">پیامکی ارسال نشده</div>';
    document.getElementById('todaySent').textContent=fa(0);
    document.getElementById('monthSent').textContent=fa(0);
    document.getElementById('failedSent').textContent=fa(0);
  }
}

loadLogs();
loadSettings();
</script>
</body>
</html>
