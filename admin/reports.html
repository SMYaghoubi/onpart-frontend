<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" href="/images/favicon.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>گزارشات | آن‌پارت</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    body{background:#f1f5f9;}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
    .kpi{background:#fff;border-radius:14px;padding:18px 20px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
    .kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
    .kpi-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;}
    .ki-blue{background:#eff6ff;color:#1d4ed8;} .ki-green{background:#dcfce7;color:#16a34a;}
    .ki-amber{background:#fef3c7;color:#d97706;} .ki-purple{background:#f5f3ff;color:#7c3aed;}
    .kpi-trend{font-size:12px;font-weight:600;border-radius:6px;padding:3px 8px;display:flex;align-items:center;gap:3px;}
    .trend-up{background:#dcfce7;color:#16a34a;} .trend-down{background:#fee2e2;color:#dc2626;}
    .kpi-val{font-size:22px;font-weight:900;color:#111;margin-bottom:3px;}
    .kpi-lbl{font-size:12px;color:#aaa;}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
    .grid3{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px;}
    .card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
    .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
    .card-title{font-size:14px;font-weight:800;color:#111;display:flex;align-items:center;gap:7px;}
    .card-title i{color:#1d4ed8;}
    .period-tabs{display:flex;gap:4px;}
    .ptab{padding:5px 12px;border-radius:6px;border:1px solid #e5e7eb;background:#fff;font-family:'Vazirmatn',sans-serif;font-size:11.5px;font-weight:600;color:#888;cursor:pointer;}
    .ptab.on{background:#1d4ed8;color:#fff;border-color:#1d4ed8;}
    .chart-area{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:8px;}
    .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;}
    .bar{width:100%;border-radius:4px 4px 0 0;cursor:pointer;}
    .bar:hover{filter:brightness(.9);}
    .bar-lbl{font-size:10px;color:#aaa;}
    .bar-val{font-size:9.5px;color:#aaa;}
    .donut{position:relative;width:120px;height:120px;flex-shrink:0;}
    .donut svg{transform:rotate(-90deg);}
    .donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
    .donut-val{font-size:18px;font-weight:900;color:#111;}
    .donut-lbl{font-size:10px;color:#aaa;}
    .legend{flex:1;display:flex;flex-direction:column;gap:8px;}
    .leg-item{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#444;}
    .leg-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
    .leg-val{margin-right:auto;font-weight:700;color:#111;}
    .mini-tbl{width:100%;border-collapse:collapse;}
    .mini-tbl th{font-size:11.5px;font-weight:700;color:#888;text-align:right;padding:8px 10px;border-bottom:2px solid #f0f0f0;}
    .mini-tbl td{font-size:12.5px;color:#333;padding:9px 10px;border-bottom:1px solid #f8f8f8;text-align:right;}
    .mini-tbl tr:last-child td{border-bottom:none;}
    .rank{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
    .rank.gold{background:#fef3c7;color:#d97706;} .rank.silver{background:#f3f4f6;color:#6b7280;} .rank.bronze{background:#fde8d8;color:#c2410c;} .rank.normal{background:#eff6ff;color:#1d4ed8;}
    .fin-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
    .fin-box{border-radius:10px;padding:14px;text-align:center;}
    .btn-exp{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:none;font-family:'Vazirmatn',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
    .be-excel{background:#dcfce7;color:#16a34a;} .be-pdf{background:#fee2e2;color:#dc2626;} .be-print{background:#eff6ff;color:#1d4ed8;}
    .filter-bar{background:#fff;border-radius:12px;padding:14px 18px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:20px;display:flex;align-items:center;gap:10px;}
    .fi{background:#f8fafc;border:1.5px solid #e5e7eb;border-radius:8px;padding:8px 12px;font-family:'Vazirmatn',sans-serif;font-size:13px;color:#333;outline:none;}
    .btn-apply{background:#1d4ed8;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-family:'Vazirmatn',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
    @media(max-width:768px){
      .kpis{grid-template-columns:1fr 1fr!important;gap:10px!important;}
      .kpi{padding:14px 16px!important;}
      .kpi-val{font-size:18px!important;}
      .kpi-icon{width:36px!important;height:36px!important;font-size:17px!important;}
      .grid2,.grid3{grid-template-columns:1fr!important;}
      .card{padding:16px!important;}
      .fin-grid{grid-template-columns:1fr 1fr!important;gap:8px!important;}
      .filter-bar{flex-wrap:wrap!important;}
      .filter-bar .fi{flex:1;min-width:120px;}
      .donut{width:90px!important;height:90px!important;}
      .mini-tbl{font-size:11px!important;}
      .mini-tbl th,.mini-tbl td{padding:6px 4px!important;}
      .period-tabs{flex-wrap:wrap;}
      .card-header{flex-wrap:wrap;gap:8px;}
      .btn-exp span{display:none;}
    }
  </style>
</head>
<body>
<div class="layout">
  <div id="sidebar-placeholder"></div>
  <div class="main">
    <div id="topbar-placeholder"></div>
    <div class="content">

      <div class="filter-bar">
        <select class="fi" id="periodSel" onchange="loadReports()">
          <option value="week">هفت روز اخیر</option>
          <option value="month" selected>این ماه</option>
          <option value="quarter">سه ماه اخیر</option>
          <option value="year">امسال</option>
        </select>
        <input class="fi" type="text" placeholder="از تاریخ" id="fromDate" style="width:110px"/>
        <input class="fi" type="text" placeholder="تا تاریخ" id="toDate" style="width:110px"/>
        <button class="btn-apply" onclick="loadReports()"><i class="ti ti-search" style="font-size:14px;margin-left:4px"></i>اعمال</button>
        <div style="margin-right:auto;display:flex;gap:8px">
          <button class="btn-exp be-excel" onclick="exportReport()"><i class="ti ti-file-spreadsheet"></i>اکسل</button>
          <button class="btn-exp be-print" onclick="window.print()"><i class="ti ti-printer"></i>چاپ</button>
        </div>
      </div>

      <!-- KPIs -->
      <div class="kpis">
        <div class="kpi">
          <div class="kpi-top"><div class="kpi-icon ki-blue"><i class="ti ti-cash"></i></div><span class="kpi-trend trend-up" id="salesTrend"><i class="ti ti-arrow-up"></i>—</span></div>
          <div class="kpi-val" id="totalSales">—</div><div class="kpi-lbl">فروش کل (تومان)</div>
        </div>
        <div class="kpi">
          <div class="kpi-top"><div class="kpi-icon ki-green"><i class="ti ti-shopping-bag"></i></div><span class="kpi-trend trend-up" id="ordersTrend"><i class="ti ti-arrow-up"></i>—</span></div>
          <div class="kpi-val" id="totalOrders">—</div><div class="kpi-lbl">تعداد سفارشات</div>
        </div>
        <div class="kpi">
          <div class="kpi-top"><div class="kpi-icon ki-amber"><i class="ti ti-users"></i></div><span class="kpi-trend trend-up"><i class="ti ti-arrow-up"></i>—</span></div>
          <div class="kpi-val" id="totalUsers">—</div><div class="kpi-lbl">کاربران فعال</div>
        </div>
        <div class="kpi">
          <div class="kpi-top"><div class="kpi-icon ki-purple"><i class="ti ti-trending-up"></i></div><span class="kpi-trend trend-up"><i class="ti ti-arrow-up"></i>—</span></div>
          <div class="kpi-val" id="avgOrder">—</div><div class="kpi-lbl">میانگین سفارش</div>
        </div>
      </div>

      <!-- Chart + Donut -->
      <div class="grid3">
        <div class="card">
          <div class="card-header">
            <div class="card-title"><i class="ti ti-chart-bar"></i>نمودار فروش</div>
            <div class="period-tabs">
              <button class="ptab" onclick="setChartPeriod(this,'week')">هفتگی</button>
              <button class="ptab on" onclick="setChartPeriod(this,'month')">ماهانه</button>
              <button class="ptab" onclick="setChartPeriod(this,'year')">سالانه</button>
            </div>
          </div>
          <div class="chart-area" id="salesChart"></div>
          <div style="display:flex;gap:16px;margin-top:12px;padding-top:12px;border-top:1px solid #f0f0f0;">
            <div style="text-align:center;flex:1"><div style="font-size:16px;font-weight:800;color:#1d4ed8" id="thisMonth">—</div><div style="font-size:11px;color:#aaa">این ماه</div></div>
            <div style="text-align:center;flex:1"><div style="font-size:16px;font-weight:800;color:#16a34a" id="growth">—</div><div style="font-size:11px;color:#aaa">رشد</div></div>
            <div style="text-align:center;flex:1"><div style="font-size:16px;font-weight:800;color:#d97706" id="lastMonth">—</div><div style="font-size:11px;color:#aaa">ماه قبل</div></div>
          </div>
        </div>
        <div class="card">
          <div class="card-header"><div class="card-title"><i class="ti ti-chart-donut"></i>دسته‌بندی</div></div>
          <div style="display:flex;align-items:center;gap:14px;">
            <div class="donut">
              <svg width="120" height="120" viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="45" fill="none" stroke="#e5e7eb" stroke-width="18"/>
                <circle cx="60" cy="60" r="45" fill="none" stroke="#1d4ed8" stroke-width="18" stroke-dasharray="113 170" stroke-dashoffset="0"/>
                <circle cx="60" cy="60" r="45" fill="none" stroke="#16a34a" stroke-width="18" stroke-dasharray="57 226" stroke-dashoffset="-113"/>
                <circle cx="60" cy="60" r="45" fill="none" stroke="#d97706" stroke-width="18" stroke-dasharray="34 249" stroke-dashoffset="-170"/>
                <circle cx="60" cy="60" r="45" fill="none" stroke="#7c3aed" stroke-width="18" stroke-dasharray="79 204" stroke-dashoffset="-204"/>
              </svg>
              <div class="donut-center"><div class="donut-val">۴</div><div class="donut-lbl">گروه</div></div>
            </div>
            <div class="legend">
              <div class="leg-item"><div class="leg-dot" style="background:#1d4ed8"></div>شمع<span class="leg-val">۴۰٪</span></div>
              <div class="leg-item"><div class="leg-dot" style="background:#16a34a"></div>لنت<span class="leg-val">۲۰٪</span></div>
              <div class="leg-item"><div class="leg-dot" style="background:#d97706"></div>کاسه نمد<span class="leg-val">۱۲٪</span></div>
              <div class="leg-item"><div class="leg-dot" style="background:#7c3aed"></div>سایر<span class="leg-val">۲۸٪</span></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Top Customers + Top Products -->
      <div class="grid2">
        <div class="card">
          <div class="card-header"><div class="card-title"><i class="ti ti-crown"></i>برترین مشتریان</div></div>
          <table class="mini-tbl" id="topCustomers">
            <thead><tr><th>#</th><th>نام</th><th>سفارشات</th><th>جمع خرید</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="card">
          <div class="card-header"><div class="card-title"><i class="ti ti-package"></i>پرفروش‌ترین محصولات</div></div>
          <table class="mini-tbl" id="topProducts">
            <thead><tr><th>#</th><th>محصول</th><th>تعداد</th><th>درآمد</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- Financial Summary -->
      <div class="card">
        <div class="card-header">
          <div class="card-title"><i class="ti ti-report-money"></i>خلاصه مالی</div>
        </div>
        <div class="fin-grid" id="finGrid"></div>
      </div>

    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/admin.js"></script>
<script>
Admin.renderSidebar('reports');
Admin.renderTopbar('گزارشات','ti-chart-bar');

const fa=n=>n.toString().replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const fmt=n=>fa(Number(n).toLocaleString());

let chartData={week:[],month:[],year:[]};
let chartLabels={week:[],month:[],year:[]};
let curPeriod='month';

function renderChart(period){
  const d=chartData[period]||[],l=chartLabels[period]||[];
  if(!d.length){
    document.getElementById('salesChart').innerHTML='<div style="width:100%;text-align:center;padding:30px;color:#aaa;font-size:13px">هنوز داده فروشی برای نمایش نمودار وجود ندارد</div>';
    return;
  }
  const max=Math.max(...d,1);
  document.getElementById('salesChart').innerHTML=d.map((v,i)=>`
    <div class="bar-col">
      <div class="bar-val">${fa(Math.round(v/1000000))}M</div>
      <div class="bar" style="height:${Math.round(v/max*100)}%;background:${i===d.length-1?'#1d4ed8':'#bfdbfe'};min-height:4px" title="${fmt(v)} تومان"></div>
      <div class="bar-lbl">${l[i]||''}</div>
    </div>`).join('');
}

function setChartPeriod(el,p){
  document.querySelectorAll('.ptab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');curPeriod=p;renderChart(p);
}

async function loadReports(){
  try {
    const token=sessionStorage.getItem('op_token');
    const [salesRes,finRes,usersRes]=await Promise.all([
      fetch(`${API.BASE_URL}/api/reports/sales`,{headers:{'Authorization':'Bearer '+token}}),
      fetch(`${API.BASE_URL}/api/reports/finance`,{headers:{'Authorization':'Bearer '+token}}),
      fetch(`${API.BASE_URL}/api/users`,{headers:{'Authorization':'Bearer '+token}})
    ]);
    const sales=await salesRes.json();
    const fin=await finRes.json();
    const usersData=await usersRes.json();
    const totalUsersCount=(usersData.users||usersData||[]).filter(u=>u.role!=='admin').length;

    const totalSales=Number(sales.totals?.total_sales||0);
    const totalOrders=Number(sales.totals?.total_orders||0);
    const avgOrder=Number(sales.totals?.avg_order||0);

    // Update KPIs
    document.getElementById('totalSales').textContent=fmt(totalSales);
    document.getElementById('totalOrders').textContent=fa(totalOrders);
    document.getElementById('totalUsers').textContent=fa(totalUsersCount);
    document.getElementById('avgOrder').textContent=fmt(Math.round(avgOrder));

    // This month vs last month from monthly data
    const monthly=sales.monthly||[];
    const thisMonthSales=Number(monthly[0]?.sales||0);
    const lastMonthSales=Number(monthly[1]?.sales||0);
    document.getElementById('thisMonth').textContent=fmt(thisMonthSales);
    document.getElementById('lastMonth').textContent=fmt(lastMonthSales);
    const growthPct=lastMonthSales>0?Math.round((thisMonthSales-lastMonthSales)/lastMonthSales*100):0;
    document.getElementById('growth').textContent=(growthPct>=0?'+':'')+fa(growthPct)+'٪';

    // Populate chart with real monthly data (reverse to chronological order)
    const monthlyAsc=[...monthly].reverse();
    chartData.month=monthlyAsc.map(m=>Number(m.sales||0));
    chartLabels.month=monthlyAsc.map(m=>(m.month||'').slice(5));
    renderChart(curPeriod);

    // Top customers
    const customers=sales.topUsers||[];
    const rankCls=['gold','silver','bronze','normal','normal'];
    if(customers.length){
      document.querySelector('#topCustomers tbody').innerHTML=customers.map((c,i)=>`
        <tr><td><div class="rank ${rankCls[i]||'normal'}">${fa(i+1)}</div></td>
        <td>${c.name||c.user_name||'---'}</td><td>${fa(c.orders)}</td>
        <td style="font-weight:700;color:#1d4ed8">${fmt(c.total)}ت</td></tr>`).join('');
    } else {
      document.querySelector('#topCustomers tbody').innerHTML='<tr><td colspan="4" style="text-align:center;padding:24px;color:#aaa;font-size:13px">هنوز سفارشی ثبت نشده است</td></tr>';
    }

    // Top products
    const products=sales.topProducts||[];
    if(products.length){
      document.querySelector('#topProducts tbody').innerHTML=products.map((p,i)=>`
        <tr><td><div class="rank ${rankCls[i]||'normal'}">${fa(i+1)}</div></td>
        <td style="font-size:12px">${(p.description||'').slice(0,22)}</td>
        <td>${fa(p.total_qty)}</td>
        <td style="font-weight:700;color:#1d4ed8">${fmt(Math.round((p.revenue||0)/1000000))}M</td></tr>`).join('');
    } else {
      document.querySelector('#topProducts tbody').innerHTML='<tr><td colspan="4" style="text-align:center;padding:24px;color:#aaa;font-size:13px">هنوز فروشی ثبت نشده است</td></tr>';
    }

    // Financial - all real data
    const totalReceived=Number(fin.payments?.total_received||0);
    const totalDebt=Number(fin.debts?.total_debt||0);
    const finData=[
      {label:'درآمد دریافتی',val:fmt(totalReceived),bg:'#f0fdf4',color:'#15803d'},
      {label:'فروش کل',val:fmt(totalSales),bg:'#eff6ff',color:'#1e40af'},
      {label:'پرداخت‌های در انتظار',val:fa(fin.payments?.pending_count||0),bg:'#fef3c7',color:'#b45309'},
      {label:'مطالبات (بدهی کاربران)',val:fmt(totalDebt),bg:'#f5f3ff',color:'#6d28d9'},
    ];
    document.getElementById('finGrid').innerHTML=finData.map(f=>`
      <div class="fin-box" style="background:${f.bg}">
        <div style="font-size:11px;color:${f.color};font-weight:700;margin-bottom:6px">${f.label}</div>
        <div style="font-size:17px;font-weight:900;color:${f.color}">${f.val}</div>
      </div>`).join('');

  } catch(e){
    console.error('loadReports error:', e);
    document.getElementById('totalSales').textContent=fmt(0);
    document.getElementById('totalOrders').textContent=fa(0);
    document.getElementById('totalUsers').textContent=fa(0);
    document.getElementById('avgOrder').textContent=fmt(0);
    document.getElementById('thisMonth').textContent=fmt(0);
    document.getElementById('growth').textContent='۰٪';
    document.getElementById('lastMonth').textContent=fmt(0);
    document.querySelector('#topCustomers tbody').innerHTML='<tr><td colspan="4" style="text-align:center;padding:24px;color:#aaa;font-size:13px">خطا در بارگذاری اطلاعات</td></tr>';
    document.querySelector('#topProducts tbody').innerHTML='<tr><td colspan="4" style="text-align:center;padding:24px;color:#aaa;font-size:13px">خطا در بارگذاری اطلاعات</td></tr>';
    document.getElementById('finGrid').innerHTML='<div style="grid-column:1/-1;text-align:center;padding:24px;color:#aaa;font-size:13px">خطا در بارگذاری اطلاعات مالی</div>';
  }
}

function exportReport(){
  alert('خروجی اکسل گزارش دانلود می‌شود');
}

loadReports();
</script>
</body>
</html>
