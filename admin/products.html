<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" href="/images/favicon.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>مدیریت محصولات | آن‌پارت</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <link rel="stylesheet" href="../css/style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body{background:#f1f5f9;}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px;}
    .sc{background:#fff;border-radius:12px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.05);display:flex;align-items:center;gap:14px;}
    .sc-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
    .si-blue{background:#eff6ff;color:#1d4ed8;} .si-green{background:#dcfce7;color:#16a34a;}
    .si-amber{background:#fef3c7;color:#d97706;} .si-red{background:#fee2e2;color:#dc2626;}
    .sc-val{font-size:20px;font-weight:900;color:#111;} .sc-lbl{font-size:11.5px;color:#aaa;}
    .toolbar{background:#fff;border-radius:12px;padding:14px 18px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .fi{background:#f8fafc;border:1.5px solid #e5e7eb;border-radius:8px;padding:8px 12px;font-family:'Vazirmatn',sans-serif;font-size:13px;color:#333;outline:none;}
    .fi:focus{border-color:#1d4ed8;} .fi-input{flex:1;min-width:180px;}
    .btn-add{background:#1d4ed8;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-family:'Vazirmatn',sans-serif;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;margin-right:auto;}
    .btn-import{background:#f0fdf4;color:#16a34a;border:1.5px solid #bbf7d0;border-radius:8px;padding:9px 16px;font-family:'Vazirmatn',sans-serif;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;}
    .btn-export-btn{background:#eff6ff;color:#1d4ed8;border:1.5px solid #bfdbfe;border-radius:8px;padding:9px 16px;font-family:'Vazirmatn',sans-serif;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;}
    .table-card{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.05);overflow:hidden;}
    .tc-head{padding:16px 20px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between;}
    .tc-title{font-size:14px;font-weight:800;color:#111;}
    .tbl{width:100%;border-collapse:collapse;}
    .tbl th{font-size:11.5px;font-weight:700;color:#888;text-align:center;padding:10px 12px;border-bottom:2px solid #f0f0f0;background:#f8fafc;white-space:nowrap;}
    .tbl th:nth-child(3){text-align:right;}
    .tbl td{font-size:12.5px;color:#333;padding:10px 12px;border-bottom:1px solid #f5f5f5;text-align:center;white-space:nowrap;}
    .tbl tbody tr:hover{background:#f9fbff;}
    .prod-cell{display:flex;align-items:center;gap:9px;text-align:right;}
    .badge{border-radius:6px;padding:3px 9px;font-size:11px;font-weight:600;}
    .b-green{background:#dcfce7;color:#16a34a;} .b-red{background:#fee2e2;color:#dc2626;}
    .b-amber{background:#fef3c7;color:#d97706;} .b-blue{background:#dbeafe;color:#1d4ed8;}
    .b-gray{background:#f3f4f6;color:#666;}
    .action-btns{display:flex;gap:5px;justify-content:center;}
    .ab{width:28px;height:28px;border-radius:7px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;}
    .ab-edit{background:#fef3c7;color:#d97706;} .ab-del{background:#fee2e2;color:#dc2626;}
    .cb{width:15px;height:15px;cursor:pointer;accent-color:#1d4ed8;}
    .pager{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-top:1px solid #f0f0f0;}
    .pager-info{font-size:12.5px;color:#aaa;}
    .pager-btns{display:flex;gap:6px;}
    .pg{width:30px;height:30px;border:1px solid #e5e7eb;border-radius:7px;background:#fff;cursor:pointer;font-family:'Vazirmatn',sans-serif;font-size:12.5px;color:#555;display:flex;align-items:center;justify-content:center;}
    .pg:hover,.pg.on{background:#1d4ed8;color:#fff;border-color:#1d4ed8;}
    .pg-dots{padding:0 6px;color:#bbb;font-size:13px;display:flex;align-items:center;}

    .desc-info-btn{background:none;border:none;color:#bbb;cursor:pointer;font-size:14px;margin-right:6px;vertical-align:middle;transition:color .15s;}
    .desc-info-btn:hover{color:#1d4ed8;}
    .desc-popup{display:none;position:absolute;top:100%;right:0;left:0;margin-top:6px;background:#fff;border:1.5px solid #e5e7eb;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.14);padding:14px 16px;z-index:50;min-width:240px;opacity:0;transform:translateY(-6px);transition:opacity .2s ease,transform .2s ease;}
    .desc-popup.show{display:block;opacity:1;transform:translateY(0);}
    .desc-popup-title{font-size:13px;font-weight:700;color:#111;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #f0f0f0;line-height:1.6;}
    .desc-popup-row{display:flex;justify-content:space-between;font-size:12px;color:#666;padding:4px 0;}
    .desc-popup-row b{color:#111;font-weight:600;}

    .be-row{display:grid;grid-template-columns:140px 1fr;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f5f5f5;}
    .be-check{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#444;cursor:pointer;}
    .be-check input{width:16px;height:16px;cursor:pointer;}

    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;}
    .modal-overlay.show{display:flex;}
    .modal{background:#fff;border-radius:18px;width:680px;max-height:92vh;overflow-y:auto;}
    .modal-head{padding:20px 24px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:10;}
    .modal-title{font-size:16px;font-weight:800;color:#111;display:flex;align-items:center;gap:8px;}
    .modal-title i{color:#1d4ed8;}
    .modal-close{width:32px;height:32px;background:#f3f4f6;border:none;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:#666;}
    .modal-body{padding:24px;}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .fg{display:flex;flex-direction:column;gap:6px;} .fg.full{grid-column:1/-1;}
    .fg label{font-size:12.5px;font-weight:600;color:#444;}
    .finput{background:#f8fafc;border:1.5px solid #e5e7eb;border-radius:9px;padding:10px 13px;font-family:'Vazirmatn',sans-serif;font-size:13.5px;color:#111;outline:none;transition:border .2s;width:100%;}
    .finput:focus{border-color:#1d4ed8;background:#fff;}
    .fselect{background:#f8fafc;border:1.5px solid #e5e7eb;border-radius:9px;padding:10px 13px;font-family:'Vazirmatn',sans-serif;font-size:13px;color:#333;outline:none;width:100%;}
    .modal-foot{padding:16px 24px;border-top:1px solid #f0f0f0;display:flex;gap:10px;position:sticky;bottom:0;background:#fff;}
    .btn-prim{background:#1d4ed8;color:#fff;border:none;border-radius:9px;padding:11px 24px;font-family:'Vazirmatn',sans-serif;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px;}
    .btn-danger{background:#dc2626;color:#fff;border:none;border-radius:9px;padding:11px 20px;font-family:'Vazirmatn',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
    .btn-sec{background:#f3f4f6;color:#555;border:none;border-radius:9px;padding:11px 18px;font-family:'Vazirmatn',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;border-radius:12px;padding:12px 24px;font-size:14px;font-weight:600;display:none;align-items:center;gap:10px;z-index:999;}
    .toast.show{display:flex;}
  </style>
</head>
<body>
<div class="layout">
  <div id="sidebar-placeholder"></div>
  <div class="main">
    <div id="topbar-placeholder"></div>
    <div class="content">

      <div class="stats">
        <div class="sc"><div class="sc-icon si-blue"><i class="ti ti-packages"></i></div><div><div class="sc-val" id="totalCount">—</div><div class="sc-lbl">کل محصولات</div></div></div>
        <div class="sc"><div class="sc-icon si-green"><i class="ti ti-circle-check"></i></div><div><div class="sc-val" id="activeCount">—</div><div class="sc-lbl">موجود</div></div></div>
        <div class="sc"><div class="sc-icon si-red"><i class="ti ti-eye-off"></i></div><div><div class="sc-val" id="outCount">—</div><div class="sc-lbl">ناموجود</div></div></div>
      </div>

      <div class="toolbar">
        <input class="fi fi-input" placeholder="جستجو نام، کد محصول..." id="searchInp" oninput="renderTable()" autocomplete="off"/>
        <select class="fi" id="carF" onchange="renderTable()">
          <option value="">همه خودروها</option>
          <option>پژو ۴۰۵</option><option>پارس</option><option>دنا</option><option>سمند</option><option>پژو ۲۰۶</option><option>رنو ال ۹۰</option><option>مشترک</option>
        </select>
        <select class="fi" id="stockF" onchange="renderTable()">
          <option value="">همه وضعیت‌ها</option>
          <option value="available">موجود</option><option value="unavailable">ناموجود</option>
        </select>
        <button class="btn-import" onclick="document.getElementById('excelInput').click()"><i class="ti ti-file-upload"></i>ورود اکسل</button>
        <input type="file" id="excelInput" accept=".xlsx,.xls,.csv" style="display:none" onchange="importExcel(this)"/>
        <button class="btn-export-btn" onclick="exportExcel()"><i class="ti ti-file-spreadsheet"></i>خروجی اکسل</button>
        <button class="btn-add" onclick="openModal('add',null)"><i class="ti ti-plus"></i>افزودن محصول</button>
      </div>

      <div class="table-card">
        <div class="tc-head">
          <div class="tc-title">لیست محصولات (<span id="prodCount">0</span>)</div>
        </div>
        <div id="bulkBar" style="display:none;align-items:center;justify-content:space-between;background:#eff6ff;border-bottom:1px solid #dbeafe;padding:10px 20px">
          <div style="font-size:13px;font-weight:700;color:#1d4ed8;display:flex;align-items:center;gap:6px">
            <i class="ti ti-checkbox" style="font-size:16px"></i>
            <span id="bulkCount">0</span> محصول انتخاب شده
            <button onclick="selectAllPages()" style="background:none;border:none;color:#1d4ed8;font-size:12px;cursor:pointer;text-decoration:underline;margin-right:8px">انتخاب همه (<span id="totalProdCount">0</span>)</button>
            <button onclick="clearSelection()" style="background:none;border:none;color:#888;font-size:12px;cursor:pointer;text-decoration:underline;margin-right:8px">لغو انتخاب</button>
          </div>
          <div style="display:flex;gap:8px">
            <button onclick="openBulkEdit()" style="background:#fff;color:#1d4ed8;border:1.5px solid #bfdbfe;border-radius:8px;padding:7px 14px;font-family:'Vazirmatn',sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px"><i class="ti ti-edit" style="font-size:14px"></i>ویرایش گروهی</button>
            <button onclick="bulkDelete()" style="background:#fee2e2;color:#dc2626;border:1.5px solid #fecaca;border-radius:8px;padding:7px 14px;font-family:'Vazirmatn',sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px"><i class="ti ti-trash" style="font-size:14px"></i>حذف گروهی</button>
          </div>
        </div>
        <div style="overflow-x:auto">
          <table class="tbl">
            <thead><tr>
              <th><input type="checkbox" class="cb" id="selectAllCb" onchange="toggleSelectAll(this.checked)"/></th>
              <th>کد محصول</th>
              <th style="text-align:right;min-width:220px">شرح محصول</th>
              <th>خودرو</th><th>برند</th><th>گروه</th>
              <th>قیمت (تومان)</th><th>گردش</th><th>وضعیت موجودی</th>
              <th>تامین‌کننده</th>
              <th>عملیات</th>
            </tr></thead>
            <tbody id="prodTbody"></tbody>
          </table>
        </div>
        <div class="pager">
          <div class="pager-info" id="pagerInfo">—</div>
          <div class="pager-btns" id="pagerBtns"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title"><i class="ti ti-package"></i><span id="modalTitle">افزودن محصول</span></div>
      <button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="fg full"><label>شرح محصول *</label><input class="finput" id="f_desc" placeholder="شرح کامل محصول..."/></div>
        <div class="fg"><label>کد محصول / OEM *</label><input class="finput" id="f_code" placeholder="کد محصول"/></div>
        <div class="fg"><label>برند</label>
          <div style="position:relative">
            <input class="finput" id="f_brand" placeholder="جستجو یا افزودن برند..." autocomplete="off" oninput="filterList('brand',this.value)" onfocus="showList('brand')" style="width:100%"/>
            <div id="brandDropdown" style="display:none;position:absolute;top:100%;right:0;left:0;background:#fff;border:1.5px solid #e5e7eb;border-radius:9px;z-index:100;max-height:200px;overflow-y:auto;box-shadow:0 8px 20px rgba(0,0,0,.1)"></div>
          </div>
        </div>
        <div class="fg"><label>خودرو</label>
          <div style="position:relative">
            <input class="finput" id="f_car" placeholder="جستجو یا افزودن خودرو..." autocomplete="off" oninput="filterList('car',this.value)" onfocus="showList('car')" style="width:100%"/>
            <div id="carDropdown" style="display:none;position:absolute;top:100%;right:0;left:0;background:#fff;border:1.5px solid #e5e7eb;border-radius:9px;z-index:100;max-height:200px;overflow-y:auto;box-shadow:0 8px 20px rgba(0,0,0,.1)"></div>
          </div>
        </div>
        <div class="fg"><label>گروه کالایی</label>
          <div style="position:relative">
            <input class="finput" id="f_cat" placeholder="جستجو یا افزودن گروه جدید..." autocomplete="off" oninput="filterCats(this.value)" onfocus="showCatList()" style="width:100%"/>
            <div id="catDropdown" style="display:none;position:absolute;top:100%;right:0;left:0;background:#fff;border:1.5px solid #e5e7eb;border-radius:9px;z-index:100;max-height:200px;overflow-y:auto;box-shadow:0 8px 20px rgba(0,0,0,.1)"></div>
          </div>
        </div>
        <div class="fg"><label>قیمت (تومان) *</label><input class="finput" id="f_price" placeholder="قیمت"/></div>
        <div class="fg"><label for="f_available">وضعیت موجودی *</label><select class="fselect" id="f_available" required aria-required="true"><option value="true">موجود</option><option value="false">ناموجود</option></select></div>
        <div class="fg"><label>گردش</label><select class="fselect" id="f_flow"><option value="0">ندارد</option><option value="1">دارد</option></select></div>
        <div class="fg"><label>وضعیت</label><select class="fselect" id="f_status"><option value="active">فعال</option><option value="inactive">غیرفعال</option></select></div>
        <div class="fg full"><label>تامین‌کننده</label>
          <div style="position:relative">
            <input class="finput" id="f_supplier_search" placeholder="جستجوی تامین‌کننده..." autocomplete="new-password" oninput="filterSuppliers(this.value)" onfocus="showSupplierList()" style="width:100%"/>
            <input type="hidden" id="f_supplier_id"/>
            <div id="supplierDropdown" style="display:none;position:absolute;top:100%;right:0;left:0;background:#fff;border:1.5px solid #e5e7eb;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.1);z-index:50;max-height:200px;overflow-y:auto;margin-top:4px"></div>
          </div>
        </div>
        <div class="fg full"><label>توضیحات</label><textarea class="finput" id="f_note" rows="2" style="resize:none" placeholder="توضیحات اضافه..."></textarea></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-prim" onclick="saveProduct()"><i class="ti ti-check"></i>ذخیره محصول</button>
      <button class="btn-danger" id="delBtn" style="display:none" onclick="confirmDelete()"><i class="ti ti-trash"></i>حذف</button>
      <button class="btn-sec" onclick="closeModal()">انصراف</button>
    </div>
  </div>
</div>

<!-- Bulk Edit Modal -->
<div class="modal-overlay" id="bulkEditModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title"><i class="ti ti-edit"></i>ویرایش گروهی (<span id="bulkEditCount">0</span> محصول)</div>
      <button class="modal-close" onclick="closeBulkEdit()"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body">
      <div style="font-size:12.5px;color:#888;margin-bottom:16px;background:#fef3c7;padding:10px 14px;border-radius:8px">
        <i class="ti ti-info-circle"></i> فقط فیلدهایی که فعال کنید روی محصولات انتخاب‌شده اعمال می‌شوند. سایر فیلدها بدون تغییر می‌مانند.
      </div>
      <div class="be-row">
        <label class="be-check"><input type="checkbox" class="be-enable" id="be_enable_category"/><span>گروه کالایی</span></label>
        <input class="finput" id="be_category" placeholder="گروه کالایی جدید"/>
      </div>
      <div class="be-row">
        <label class="be-check"><input type="checkbox" class="be-enable" id="be_enable_car"/><span>خودرو</span></label>
        <input class="finput" id="be_car" placeholder="خودروی جدید"/>
      </div>
      <div class="be-row">
        <label class="be-check"><input type="checkbox" class="be-enable" id="be_enable_brand"/><span>برند</span></label>
        <input class="finput" id="be_brand" placeholder="برند جدید"/>
      </div>
      <div class="be-row">
        <label class="be-check"><input type="checkbox" class="be-enable" id="be_enable_price"/><span>قیمت</span></label>
        <input class="finput" id="be_price" placeholder="قیمت جدید (تومان)"/>
      </div>
      <div class="be-row">
        <label class="be-check"><input type="checkbox" class="be-enable" id="be_enable_available"/><span>وضعیت موجودی</span></label>
        <select class="fselect" id="be_available"><option value="true">موجود</option><option value="false">ناموجود</option></select>
      </div>
      <div class="be-row">
        <label class="be-check"><input type="checkbox" class="be-enable" id="be_enable_supplier"/><span>تأمین‌کننده</span></label>
        <div style="position:relative;flex:1;min-width:0">
          <input class="finput" id="be_supplier_search" list="be_supplier_options" placeholder="جستجو یا انتخاب تأمین‌کننده؛ برای حذف «بدون تأمین‌کننده»" autocomplete="off" oninput="resolveBulkSupplier()"/>
          <input type="hidden" id="be_supplier_id"/>
          <datalist id="be_supplier_options"></datalist>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-prim" onclick="applyBulkEdit()"><i class="ti ti-check"></i>اعمال تغییرات</button>
      <button class="btn-sec" onclick="closeBulkEdit()">انصراف</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../js/api.js"></script>
<script src="../js/admin.js"></script>
<script>
Admin.renderSidebar('products');
Admin.renderTopbar('مدیریت محصولات','ti-packages');

const fa = n => n.toString().replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const fmt = n => fa(Number(n).toLocaleString());
let products = [], filtered = [], currentId = null, page = 1;
let selectedIds = new Set();
const PER_PAGE = 15;

function toast(msg, ok=true){
  Admin.toast(msg,ok?'success':'error');
}

let productRequestSequence = 0;
async function loadProducts({silent=false} = {}){
  const sequence=++productRequestSequence;
  try {
    const data=await API.request('/api/products?limit=99999&admin=1',{authContext:'admin',cache:'no-store'});
    if(sequence!==productRequestSequence)return;
    if(!data||!Array.isArray(data.products))throw new Error('پاسخ محصولات معتبر نیست');
    products=data.products;updateStats();renderTable();
  } catch(error) {
    if(sequence!==productRequestSequence)return;
    products=[];filtered=[];updateStats();
    const tbody=document.getElementById('prodTbody');

function stockStatus(p){
  return (p.available===true) ? {label:'موجود',cls:'b-green'} : {label:'ناموجود',cls:'b-red'};
}

function renderTable(){
  const s = document.getElementById('searchInp').value.trim();
  const normalizedCode=API.normalizeProductCode(s);
  const normalizedText=s.normalize('NFKC').toLocaleLowerCase('fa-IR');
  const cf = document.getElementById('carF').value;
  const sf = document.getElementById('stockF').value;
  filtered = products.filter(p=>{
    if(s && !String(p.description||'').normalize('NFKC').toLocaleLowerCase('fa-IR').includes(normalizedText) && !API.normalizeProductCode(p.code).includes(normalizedCode)) return false;
    if(cf && p.car !== cf) return false;
    if(sf){
      const st = stockStatus(p).label;
      if(sf==='available' && st!=='موجود') return false;
      if(sf==='unavailable' && st!=='ناموجود') return false;
    }
    return true;
  });
  const total = filtered.length;
  const pages = Math.ceil(total/PER_PAGE);
  if(page>pages) page=1;
  const start=(page-1)*PER_PAGE, end=Math.min(start+PER_PAGE,total);
  const slice = filtered.slice(start, end);

  document.getElementById('prodCount').textContent = fa(total);
  document.getElementById('pagerInfo').textContent = `نمایش ${fa(start+1)}–${fa(end)} از ${fa(total)}`;

  document.getElementById('prodTbody').innerHTML = slice.map(p => {
    const st = stockStatus(p);
    return `<tr>
      <td><input type="checkbox" class="cb" ${selectedIds.has(p.id)?'checked':''} onchange="toggleSelect(${p.id},this.checked)"/></td>
      <td style="font-family:monospace;font-size:11.5px;color:#888">${Admin.escape(p.code||'')}</td>
      <td style="text-align:right;font-size:12px;max-width:240px;overflow:hidden;text-overflow:ellipsis;position:relative">
        <span>${Admin.escape(p.description||'')}</span>
        ${p.note?`<button class="desc-info-btn" onclick="toggleDescPopup(event,${p.id})" title="توضیحات اضافه"><i class="ti ti-info-circle"></i></button>`:''}
        <div class="desc-popup" id="descPopup_${p.id}">
          <div class="desc-popup-title">توضیحات اضافه</div>
          <div style="font-size:12.5px;color:#444;line-height:1.8;white-space:pre-wrap">${Admin.escape(p.note||'—')}</div>
        </div>
      </td>
      <td style="font-size:12px">${Admin.escape(p.car||'')}</td>
      <td><span class="badge b-blue">${Admin.escape(p.brand||'')}</span></td>
      <td style="font-size:11.5px;color:#777">${Admin.escape(p.category||'')}</td>
      <td style="font-weight:700">${fmt(p.price||0)}</td>
      <td><span class="badge ${p.has_flow==1?'b-blue':'b-gray'}">${p.has_flow==1?'دارد':'ندارد'}</span></td>
      <td><span class="badge ${st.cls}">${st.label}</span></td>
      <td style="font-size:11.5px;color:#666">${Admin.escape(p.supplier_name||'—')}</td>
      <td><div class="action-btns">
        <button class="ab ab-edit" onclick="editProduct(${p.id})" title="ویرایش"><i class="ti ti-edit"></i></button>
        <button class="ab ab-del" onclick="confirmDelete(${p.id})" title="حذف"><i class="ti ti-trash"></i></button>
      </div></td>
    </tr>`;
  }).join('');

  document.getElementById('selectAllCb').checked = slice.length>0 && slice.every(p=>selectedIds.has(p.id));
  updateBulkBar();

  // Smart pagination: show limited page buttons with ellipsis
  let btns = '';
  function pgBtn(i){ return `<button class="pg${i===page?' on':''}" onclick="gotoPage(${i})">${fa(i)}</button>`; }
  if(pages<=7){
    for(let i=1;i<=pages;i++) btns+=pgBtn(i);
  } else {
    btns += pgBtn(1);
    if(page>3) btns += `<span class="pg-dots">...</span>`;
    const from = Math.max(2, page-1), to = Math.min(pages-1, page+1);
    for(let i=from;i<=to;i++) btns+=pgBtn(i);
    if(page<pages-2) btns += `<span class="pg-dots">...</span>`;
    btns += pgBtn(pages);
  }
  document.getElementById('pagerBtns').innerHTML = btns;
}

  const button=document.querySelector('#bulkBar button[onclick="bulkDelete()"]');
  if(button)button.disabled=true;
  try{
    const result=await API.request('/api/products/bulk-delete',{method:'POST',authContext:'admin',body:JSON.stringify({ids:[...selectedIds]})});
    const success=Number(result.deleted||0)+Number(result.archived||0)+Number(result.skipped||0);
    toast(result.message||`${fa(success)} محصول پردازش شد`,!result.failed);

async function applyBulkEdit(){
  const fields = {};

  if(document.getElementById('be_enable_car')?.checked) fields.car = document.getElementById('be_car').value;

  if(document.getElementById('be_enable_price')?.checked) fields.price = Number(document.getElementById('be_price').value.replace(/,/g,''));

async function saveProduct(){
  const desc = document.getElementById('f_desc').value.trim();
  const code = document.getElementById('f_code').value.trim();
  const price = document.getElementById('f_price').value.trim();
  const availabilityValue = document.getElementById('f_available').value;
  if(!desc||!code||!price||!['true','false'].includes(availabilityValue)){ toast('لطفاً فیلدهای اجباری و وضعیت موجودی را تکمیل کنید',false); return; }

  const data = {
    description: desc, code, brand: document.getElementById('f_brand').value,
    car: document.getElementById('f_car').value, category: document.getElementById('f_cat').value,
    price: Number(price.replace(/,/g,'')), available: availabilityValue==='true',
    has_flow: Number(document.getElementById('f_flow').value),
    status: document.getElementById('f_status').value,
    note: document.getElementById('f_note').value,
    supplier_id: document.getElementById('f_supplier_id').value || null
  };

  try {
    const token = OnPartSession.getToken('admin');
    const url = currentId ? `${API.BASE_URL}/api/products/${currentId}` : `${API.BASE_URL}/api/products`;
    const method = currentId ? 'PUT' : 'POST';
    const res = await fetch(url, { method, headers: {'Content-Type':'application/json','Authorization':'Bearer '+token}, body: JSON.stringify(data) });
    const result = await res.json();
    if(!res.ok){ console.error('Save product failed:', result); throw new Error(result.message||'خطای سرور'); }
    toast(currentId?'محصول ویرایش شد':'محصول اضافه شد');
    closeModal(); await loadProducts();
  } catch(e) {
    console.error('Save product error:', e);
    toast(e.message||'خطا در ذخیره', false);
  }
}

async function confirmDelete(id){
  currentId = id || currentId;

function exportExcel(){
  const rows=filtered.map(p=>({'کد':String(p.code??''),'شرح':p.description,'خودرو':p.car,'برند':p.brand,'گروه':p.category,'قیمت':Number(p.price||0),'وضعیت موجودی':p.available===true?'موجود':'ناموجود','گردش':p.has_flow==1?'دارد':'ندارد','تامین‌کننده':p.supplier_id||''}));
  const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();
  for(let row=2;row<=rows.length+1;row++){const cell=ws[`A${row}`];if(cell){cell.t='s';cell.v=String(cell.v??'');cell.z='@'}}
  ws['!cols']=[{wch:18},{wch:48},{wch:18},{wch:18},{wch:20},{wch:16},{wch:16},{wch:10},{wch:18}];
  XLSX.utils.book_append_sheet(wb,ws,'محصولات');XLSX.writeFile(wb,'onpart-products.xlsx');
  toast('خروجی اکسل دانلود شد');

function importExcel(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});
      if(!rows.length)throw new Error('فایل خالی است یا قابل خواندن نیست');
      const columns={
        code:['کد','کد محصول','code','Code'],description:['شرح','شرح محصول','نام','description','Description'],
        car:['خودرو','car','Car'],brand:['برند','brand','Brand'],category:['گروه','گروه کالا','گروه کالایی','دسته','category','Category'],
        price:['قیمت','price','Price'],availability:['وضعیت موجودی','availability','Availability'],legacyStock:['موجودی','stock','Stock']
      };
      const find=(row,keys)=>{for(const key of keys)if(row[key]!==undefined&&row[key]!=='')return row[key];return ''};
      const legacyRows=[];
      const parsed=rows.map((row,index)=>{
        const availabilityRaw=find(row,columns.availability),legacyRaw=find(row,columns.legacyStock);
        let available=false;
        if(availabilityRaw!==''){
          const value=String(availabilityRaw).trim();
          if(value!=='موجود'&&value!=='ناموجود')throw new Error(`ردیف ${index+2}: وضعیت موجودی فقط باید «موجود» یا «ناموجود» باشد`);
          available=value==='موجود';
        }else if(legacyRaw!==''){
          const value=Number(String(legacyRaw).replace(/[,٬\s]/g,''));
          if(!Number.isInteger(value)||value<0)throw new Error(`ردیف ${index+2}: موجودی عددی قدیمی معتبر نیست`);
          available=value>0;legacyRows.push(index+2);
        }else{throw new Error(`ردیف ${index+2}: ستون «وضعیت موجودی» الزامی است`)}
        return {code:String(find(row,columns.code)).trim(),description:String(find(row,columns.description)).trim(),car:String(find(row,columns.car)).trim(),brand:String(find(row,columns.brand)).trim(),category:String(find(row,columns.category)).trim(),price:Number(String(find(row,columns.price)).replace(/[^0-9.]/g,''))||0,available};
      }).filter(product=>product.code&&product.description);
      if(!parsed.length)throw new Error('هیچ ردیف معتبری یافت نشد؛ ستون‌های کد و شرح الزامی هستند');
      if(legacyRows.length&&!confirm(`این فایل قدیمی است و در ${fa(legacyRows.length)} ردیف موجودی عددی دارد. این مقادیر فقط به «موجود/ناموجود» تبدیل می‌شوند و عدد ذخیره نمی‌شود. ادامه می‌دهید؟`))return;
      toast(`در حال وارد کردن ${fa(parsed.length)} محصول...`);
      const result=await API.request('/api/products/bulk-import',{method:'POST',authContext:'admin',body:JSON.stringify({products:parsed})});
      toast(`موفق: ${fa(result.imported)} محصول جدید، ${fa(result.updated)} به‌روزرسانی شد${result.failed?` — ${fa(result.failed)} ناموفق`:''}`);
      loadProducts();
    }catch(error){toast('خطا در خواندن یا ارسال فایل: '+error.message,false)}
    finally{input.value=''}
  };
  reader.readAsArrayBuffer(file);
}

function filterList(type, q){

  var dd = document.getElementById(type+'Dropdown');
  if(!dd) return;
  var results = q ? list.filter(function(c){ return c.includes(q); }) : list;
  var html = '';
  results.forEach(function(c){
    html += '<div onclick="selectItem(\''+type+'\',\''+c+'\')" style="padding:9px 14px;cursor:pointer;font-size:13px;color:#333;border-bottom:1px solid #f5f5f5" onmouseover="this.style.background=\'#f0f4ff\'" onmouseout="this.style.background=\'\'">'+c+'</div>';
  });
  if(q && !list.find(function(c){ return c===q; })){
    html += '<div onclick="addAndSelectItem(\''+type+'\',\''+q+'\')" style="padding:9px 14px;cursor:pointer;font-size:13px;color:#1d4ed8;border-top:1px solid #e5e7eb;display:flex;align-items:center;gap:6px" onmouseover="this.style.background=\'#eff6ff\'" onmouseout="this.style.background=\'\'"><i class="ti ti-plus" style="font-size:14px"></i>افزودن "'+q+'" جدید</div>';
  }
  dd.innerHTML = html || '<div style="padding:12px;text-align:center;color:#aaa;font-size:13px">موردی یافت نشد</div>';
  dd.style.display = 'block';
}

function selectItem(type, val){

  document.getElementById(type+'Dropdown').style.display = 'none';

function addAndSelectItem(type, val){

  selectItem(type, val);
  Admin.toast('"'+val+'" \u0627\u0636\u0627\u0641\u0647 \u0634\u062f');
}

async function loadApprovedSuppliers(){
  const token = OnPartSession.getToken('admin');
  try {
    const res = await fetch(`${API.BASE_URL}/api/suppliers`, {headers:{'Authorization':'Bearer '+token}});
    if(res.ok){
      const data = await res.json();
      allSuppliers = data.filter(s => s.status === 'approved');
      // If no approved suppliers, show all pending ones too
      refreshBulkSupplierOptions();
    }
  } catch(e){}
}

function showSupplierList(){
  filterSuppliers(document.getElementById('f_supplier_search').value);
  document.getElementById('supplierDropdown').style.display='block';
}

function filterSuppliers(q){
  const dd = document.getElementById('supplierDropdown');
  const list = q ? allSuppliers.filter(s => (s.company||'').includes(q) || (s.name||'').includes(q)) : allSuppliers;
  if(!list.length){ dd.innerHTML='<div style="padding:12px;font-size:13px;color:#aaa;text-align:center">تامین‌کننده تایید شده‌ای یافت نشد</div>'; dd.style.display='block'; return; }
  dd.innerHTML = list.map(s=>`
    <div onclick="pickSupplier(${s.id},'${s.company.replace(/'/g,"&#39;")}')" style="display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:0.5px solid #f5f5f5" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='#fff'">
      <div>
        <div style="font-size:13px;font-weight:600;color:#111">${s.company}</div>
        <div style="font-size:11px;color:#aaa">${s.name||''} — ${s.city||''}</div>
      </div>
    </div>`).join('');
  dd.style.display='block';
}

function pickSupplier(id, name){
  document.getElementById('f_supplier_id').value = id;
  document.getElementById('f_supplier_search').value = name;
  document.getElementById('supplierDropdown').style.display = 'none';
}

document.addEventListener('click', function(e){
  if(!e.target.closest('#f_supplier_search') && !e.target.closest('#supplierDropdown')){
    const dd = document.getElementById('supplierDropdown');
    if(dd) dd.style.display='none';
  }
});

loadProducts();
loadApprovedSuppliers();
let lastProductsRefresh=Date.now();
function refreshProductsWhenVisible(){
  if(document.hidden||Date.now()-lastProductsRefresh<3000)return;
  lastProductsRefresh=Date.now();loadProducts({silent:true});
}
window.addEventListener('onpart:user-data-changed',event=>{
  const entity=String(event.detail?.entity||'');
  if(!entity||entity==='product'||entity==='products'){lastProductsRefresh=0;refreshProductsWhenVisible()}
});
window.addEventListener('pageshow',refreshProductsWhenVisible);
document.addEventListener('visibilitychange',refreshProductsWhenVisible);
</script>
</body>
</html>
