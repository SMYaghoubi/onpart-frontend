<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تغییرات تأمین‌کنندگان | آن‌پارت</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"><link rel="stylesheet" href="../css/style.css"><style>body{background:#f1f5f9}.card{background:#fff;border-radius:14px;box-shadow:0 1px 4px #0001;overflow:hidden}.toolbar{display:flex;gap:8px;margin-bottom:14px}.filter{padding:9px 13px;border:1.5px solid #ddd;border-radius:9px;font:12px Vazirmatn}.tbl{width:100%;border-collapse:collapse;min-width:800px}.tbl th,.tbl td{padding:10px;border-bottom:1px solid #eee;font-size:12px;text-align:center}.tbl th{background:#f8fafc;color:#64748b}.badge{padding:3px 9px;border-radius:15px;font-size:10.5px}.pending{background:#fef3c7;color:#a16207}.approved{background:#dcfce7;color:#15803d}.rejected{background:#fee2e2;color:#b91c1c}.btn{border:0;border-radius:8px;padding:7px 11px;font:600 11.5px Vazirmatn;cursor:pointer}.view{background:#eff6ff;color:#1d4ed8}.overlay{display:none;position:fixed;inset:0;background:#0007;z-index:300;align-items:center;justify-content:center;padding:15px}.overlay.show{display:flex}.modal{background:#fff;border-radius:16px;width:min(1000px,100%);max-height:92vh;overflow:auto}.head,.foot{padding:14px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #eee}.foot{border:0;border-top:1px solid #eee}.body{padding:18px}.percent{width:95px;border:1.5px solid #ddd;border-radius:8px;padding:8px;text-align:center}.approve{background:#16a34a;color:#fff}.reject{background:#fee2e2;color:#b91c1c}.close{background:#e5e7eb;color:#444}.summary{display:flex;gap:15px;background:#f8fafc;padding:12px;border-radius:10px;margin-bottom:12px;font-size:12px;flex-wrap:wrap}.final{font-weight:800;color:#16a34a}.empty{text-align:center;padding:35px;color:#999}</style></head><body><div class="layout"><div id="sidebar-placeholder"></div><main class="main"><div id="topbar-placeholder"></div><div class="content"><div class="toolbar"><select class="filter" id="status" onchange="loadBatches()"><option value="pending">در انتظار بررسی</option><option value="">همه</option><option value="approved">تأییدشده</option><option value="rejected">ردشده</option></select></div><div class="card"><div style="overflow:auto"><table class="tbl"><thead><tr><th>شماره</th><th>شرکت</th><th>منبع</th><th>تعداد</th><th>زمان ارسال</th><th>درصد</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody id="tbody"></tbody></table></div></div></div></main></div><div class="overlay" id="modal"><div class="modal"><div class="head"><b id="modalTitle">بررسی تغییرات</b><button class="btn close" style="margin-right:auto" onclick="closeModal()">بستن</button></div><div class="body"><div class="summary" id="summary"></div><div style="overflow:auto"><table class="tbl"><thead><tr><th>کد</th><th>شرح</th><th>برند</th><th>قیمت فعلی</th><th>قیمت تأمین‌کننده</th><th>درصد ردیف</th><th>قیمت نهایی</th><th>وضعیت موجودی</th></tr></thead><tbody id="items"></tbody></table></div></div><div class="foot" id="foot"><label style="font-size:12px">درصد افزایش کل <input class="percent" id="percent" type="number" min="0" step="0.1" value="0" oninput="recalc()"> ٪</label><input class="filter" id="note" style="flex:1" placeholder="یادداشت بررسی (اختیاری)"><button class="btn approve" onclick="approve()"><i class="ti ti-check"></i> تأیید و اعمال</button><button class="btn reject" onclick="rejectBatch()"><i class="ti ti-x"></i> رد</button></div></div></div><script src="../js/api.js"></script><script src="../js/admin.js"></script><script>
Admin.renderSidebar('supplier_updates');Admin.renderTopbar('تغییرات تأمین‌کنندگان','ti-file-check');const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]),fmt=n=>fa(Number(n||0).toLocaleString())+' تومان';let batches=[],current=null,items=[];
const adminRequest=(path,options={})=>API.request(path,{...options,authContext:'admin'});
function batchManagementError(error){return error&&[401,403].includes(error.status)?'نشست مدیریت منقضی شده یا مجوز کافی نیست.':'خطا در دریافت درخواست‌های تأمین‌کنندگان.'}
function renderBatchState(message,authError=false){document.getElementById('tbody').innerHTML=`<tr><td colspan="8" class="empty" role="${authError?'alert':'status'}">${Admin.escape(message)}${authError?'<br><a href="/admin/login" style="display:inline-block;margin-top:10px;color:#1d4ed8;font-weight:700">ورود دوباره به پنل مدیریت</a>':''}</td></tr>`}
async function loadBatches(){
  renderBatchState('در حال دریافت درخواست‌ها...');
  try{
    const st=document.getElementById('status').value;
    const data=await adminRequest('/api/supplier-portal/admin/updates'+(st?'?status='+encodeURIComponent(st):''));
    batches=Array.isArray(data.batches)?data.batches:[];
    renderBatches();
  }catch(error){
    batches=[];
    const message=batchManagementError(error),authError=[401,403].includes(error.status);
    renderBatchState(message,authError);
    Admin.toast(message,'error');
  }
}
function renderBatches(){const labels={pending:'در انتظار',approved:'تأیید شده',rejected:'رد شده'};document.getElementById('tbody').innerHTML=batches.length?batches.map(b=>`<tr><td>#${fa(b.id)}</td><td><b>${Admin.escape(b.company)}</b><br><small>${Admin.escape(b.name||'')}</small></td><td>${b.source==='excel'?'فایل اکسل':'دستی'}</td><td>${fa(b.item_count)}</td><td>${toJalali(b.submitted_at)}</td><td>${b.markup_percent==null?'—':fa(b.markup_percent)+'٪'}</td><td><span class="badge ${b.status}">${labels[b.status]}</span></td><td><button class="btn view" onclick="openBatch(${b.id})">بررسی</button> <button class="btn reject" onclick="deleteBatch(event,${b.id})"><i class="ti ti-trash"></i> حذف</button></td></tr>`).join(''):'<tr><td colspan="8" class="empty">موردی وجود ندارد.</td></tr>'}
async function openBatch(id){try{const data=await adminRequest('/api/supplier-portal/admin/updates/'+id);current=data.batch;items=data.items||[];const batchErrors=data.errors||[];document.getElementById('modalTitle').textContent=`بررسی بسته #${id} — ${current.company}`;document.getElementById('summary').innerHTML=`<span>تأمین‌کننده: <b>${Admin.escape(current.company)}</b></span><span>تعداد: <b>${fa(items.length)}</b></span><span>نوع: <b>${current.source==='excel'?'اکسل':'دستی'}</b></span><span>فایل: <b>${Admin.escape(current.original_filename||'—')}</b></span><span>وضعیت: <b>${Admin.escape(current.status)}</b></span>${batchErrors.length?'<div style="width:100%;color:#b91c1c"><b>خطاها:</b><br>'+batchErrors.map(e=>Admin.escape(e.error_message)).join('<br>')+'</div>':''}`;document.getElementById('percent').value=current.markup_percent??0;document.getElementById('note').value=current.note||'';document.getElementById('foot').style.display=current.status==='pending'?'flex':'none';renderItems();document.getElementById('modal').classList.add('show')}catch(e){Admin.toast(e.message,'error')}}
function availabilityLabel(value){return value?'موجود':'ناموجود'}
function renderItems(){const def=Number(document.getElementById('percent').value)||0;document.getElementById('items').innerHTML=items.map(i=>{const p=i._percent==null?def:Number(i._percent),final=Math.round(Number(i.supplier_price)*(1+p/100));return `<tr><td>${Admin.escape(i.code)}</td><td style="text-align:right">${Admin.escape(i.description)}</td><td>${Admin.escape(i.brand||'—')}</td><td>${fmt(i.previous_price)}</td><td><input class="percent" type="number" min="0" step="1" value="${i.supplier_price}" ${current.status==='pending'?'':'disabled'} onchange="saveItem(${i.id},'supplier_price',this.value)"></td><td><input class="percent row-percent" data-id="${i.id}" type="number" min="0" step="0.1" placeholder="کل" value="${i._percent??''}" onchange="setRowPercent(${i.id},this.value)"></td><td class="final">${fmt(final)}</td><td><select class="filter" ${current.status==='pending'?'':'disabled'} onchange="saveItem(${i.id},'available',this.value)"><option value="" ${i.proposed_available==null?'selected':''}>بدون تغییر</option><option value="true" ${i.proposed_available===true?'selected':''}>موجود</option><option value="false" ${i.proposed_available===false?'selected':''}>ناموجود</option></select><br><small>قبلی: ${availabilityLabel(Boolean(i.previous_available))} | ${Admin.escape(i.note||i.status)}</small></td></tr>`}).join('')}
async function saveItem(id,field,value){const item=items.find(x=>x.id===id);if(!item||current.status!=='pending')return;const key=field==='available'?'proposed_available':'supplier_price',old=item[key],parsed=field==='available'?(value===''?null:value==='true'):Number(value);if(field==='supplier_price'&&(!Number.isInteger(parsed)||parsed<0)){Admin.toast('قیمت نامعتبر است','error');renderItems();return}item[key]=parsed;try{await adminRequest('/api/supplier-portal/admin/updates/'+current.id+'/items/'+id,{method:'PATCH',body:JSON.stringify({supplier_price:Number(item.supplier_price),available:item.proposed_available})});Admin.toast('ردیف ذخیره شد')}catch(e){item[key]=old;renderItems();Admin.toast(e.message,'error')}}function recalc(){renderItems()}function setRowPercent(id,value){const i=items.find(x=>x.id===id);if(i)i._percent=value===''?null:Number(value);renderItems()}function closeModal(){document.getElementById('modal').classList.remove('show')}
async function approve(){if(!confirm('پس از تأیید، قیمت و موجودی محصولات اصلی تغییر می‌کند. ادامه می‌دهید؟'))return;const overrides={};items.forEach(i=>{if(i._percent!=null)overrides[i.id]=i._percent});try{const d=await adminRequest(`/api/supplier-portal/admin/updates/${current.id}/approve`,{method:'POST',body:JSON.stringify({markup_percent:Number(document.getElementById('percent').value)||0,item_percentages:overrides,note:document.getElementById('note').value})});Admin.toast(d.message);closeModal();loadBatches()}catch(e){Admin.toast(e.message,'error')}}
async function deleteBatch(event,id){event.stopPropagation();if(!confirm('درخواست حذف یا بایگانی شود؟'))return;try{const data=await adminRequest('/api/supplier-portal/admin/updates/'+id,{method:'DELETE'});Admin.toast(data.message);loadBatches()}catch(e){Admin.toast(e.message,'error')}}async function rejectBatch(){const note=document.getElementById('note').value.trim();if(!note){Admin.toast('دلیل رد را در یادداشت بنویسید','error');return}try{await adminRequest(`/api/supplier-portal/admin/updates/${current.id}/reject`,{method:'POST',body:JSON.stringify({note})});Admin.toast('تغییرات رد شد');closeModal();loadBatches()}catch(e){Admin.toast(e.message,'error')}}loadBatches();</script></body></html>
