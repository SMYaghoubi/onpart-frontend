<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" href="/images/favicon.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ورود به پنل مدیریت | آن‌پارت</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Vazirmatn',sans-serif;}
    body{background:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;}
    .blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:0.15;pointer-events:none;}
    .blob1{width:400px;height:400px;background:#1d4ed8;top:-100px;right:-100px;}
    .blob2{width:300px;height:300px;background:#7c3aed;bottom:-80px;left:-60px;}

    .card{background:#1e293b;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:44px 40px;width:100%;max-width:420px;position:relative;z-index:2;animation:fadeUp .4s ease;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

    .logo-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:32px;}
    .logo-box{width:56px;height:56px;background:#1d4ed8;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;}
    .logo-name{font-size:22px;font-weight:800;color:#fff;}
    .logo-name span{color:#60a5fa;}
    .logo-sub{font-size:13px;color:rgba(255,255,255,.4);margin-top:2px;}

    .alert{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:12px 14px;font-size:13px;color:#fca5a5;margin-bottom:20px;display:none;align-items:center;gap:8px;}
    .alert.show{display:flex;}

    .fg{margin-bottom:18px;}
    .flabel{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.6);margin-bottom:7px;display:block;}
    .input-row{display:flex;align-items:center;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);border-radius:10px;overflow:hidden;transition:all .2s;}
    .input-row:focus-within{border-color:#1d4ed8;background:rgba(29,78,216,.1);}
    .input-row.error{border-color:#ef4444;}
    .finput{flex:1;border:none;background:transparent;padding:12px 14px;font-family:'Vazirmatn',sans-serif;font-size:14px;color:#fff;outline:none;min-width:0;}
    .finput::placeholder{color:rgba(255,255,255,.25);}
    .input-icon{padding:0 14px;color:rgba(255,255,255,.3);font-size:18px;display:flex;align-items:center;}
    .eye-btn{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.3);font-size:18px;padding:0 12px;display:flex;align-items:center;transition:color .15s;}
    .eye-btn:hover{color:#60a5fa;}

    .btn-login{width:100%;background:#1d4ed8;color:#fff;border:none;border-radius:10px;padding:13px;font-family:'Vazirmatn',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;}
    .btn-login:hover{background:#1e40af;}
    .btn-login:disabled{background:#334155;cursor:not-allowed;}
    .btn-login .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none;}
    .btn-login.loading .spinner{display:block;}
    .btn-login.loading .btn-text{display:none;}
    @keyframes spin{to{transform:rotate(360deg)}}

    .back-link{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:20px;font-size:12.5px;color:rgba(255,255,255,.35);text-decoration:none;transition:color .15s;}
    .back-link:hover{color:rgba(255,255,255,.6);}

    .security-note{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:9px;padding:10px 14px;margin-top:20px;}
    .security-note i{color:#60a5fa;font-size:16px;flex-shrink:0;}
    .security-note span{font-size:11.5px;color:rgba(255,255,255,.35);line-height:1.5;}
      /* Branded marketing portal */
    body{background:radial-gradient(circle at 80% 12%,#2563eb35,transparent 28%),radial-gradient(circle at 9% 88%,#7c3aed35,transparent 30%),linear-gradient(145deg,#050b1a,#0f1d38 55%,#11123a);isolation:isolate}
    body:before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background-image:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,#000b,transparent 90%)}.blob{filter:blur(65px);opacity:.28;animation:adminFloat 10s ease-in-out infinite alternate}.blob2{animation-delay:-4s}
    .card{max-width:450px;padding:46px 42px;border-radius:24px;background:linear-gradient(145deg,#17243cdd,#111d34e8);border:1px solid #ffffff2e;box-shadow:0 30px 90px #020617a8,inset 0 1px #ffffff1f;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}.card:before{content:"";position:absolute;inset:0 0 auto;height:3px;border-radius:24px 24px 0 0;background:linear-gradient(90deg,#2563eb,#8b5cf6,#22d3ee)}.logo-wrap img{filter:drop-shadow(0 10px 24px #02061780)}.logo-sub{color:#cbd5e1}.input-row{min-height:49px;border-radius:12px;background:#ffffff0a;border-color:#ffffff1c}.input-row:focus-within{border-color:#60a5fa;background:#2563eb18;box-shadow:0 0 0 4px #60a5fa12}.btn-login{min-height:50px;border-radius:12px;background:linear-gradient(100deg,#1d4ed8,#4f46e5 58%,#0891b2);box-shadow:0 14px 30px #1d4ed83d}.btn-login:hover{background:linear-gradient(100deg,#1e40af,#4338ca 58%,#0e7490);transform:translateY(-1px)}.btn-login:focus-visible,.eye-btn:focus-visible,.back-link:focus-visible{outline:3px solid #67e8f9;outline-offset:3px}.security-note{background:#ffffff08;border-color:#ffffff12}.back-link{color:#94a3b8}
    @keyframes adminFloat{to{transform:translate3d(55px,-35px,0) scale(1.12)}}
    @media(max-width:520px){body{padding:12px;overflow:auto}.card{padding:34px 22px;border-radius:20px}.logo-wrap{margin-bottom:26px}}
    @media(prefers-reduced-motion:reduce){.blob,.card{animation:none!important}.btn-login,.input-row{transition:none!important}}
  </style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <div class="card">
    <div class="logo-wrap">
      <img src="../images/logo.png" alt="لوگوی آن‌پارت" style="height:44px;object-fit:contain"/>
      <div class="logo-name">On<span>Part</span></div>
      <div class="logo-sub">پنل مدیریت سامانه بازاریابان</div>
    </div>

    <div class="alert" id="errorAlert" role="alert" aria-live="polite">
      <i class="ti ti-alert-circle"></i>
      <span id="errorMsg">نام کاربری یا رمز عبور اشتباه است</span>
    </div>

    <div class="fg">
      <label class="flabel">نام کاربری</label>
      <div class="input-row" id="row1">
        <div class="input-icon"><i class="ti ti-user"></i></div>
        <input class="finput" type="text" id="username" placeholder="نام کاربری ادمین" autocomplete="username"/>
      </div>
    </div>

    <div class="fg">
      <label class="flabel">رمز عبور</label>
      <div class="input-row" id="row2">
        <div class="input-icon"><i class="ti ti-lock"></i></div>
        <input class="finput" type="password" id="password" placeholder="رمز عبور" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
        <button class="eye-btn" onclick="togglePw()"><i class="ti ti-eye" id="eyeIcon"></i></button>
      </div>
    </div>

    <button class="btn-login" id="loginBtn" onclick="doLogin()">
      <div class="spinner"></div>
      <span class="btn-text"><i class="ti ti-login"></i> ورود به پنل</span>
    </button>

    <a class="back-link" href="/">
      <i class="ti ti-arrow-right"></i>
      بازگشت به صفحه اصلی
    </a>

    <div class="security-note">
      <i class="ti ti-shield-lock"></i>
      <span>این بخش فقط برای مدیران سیستم است. دسترسی غیرمجاز پیگرد قانونی دارد.</span>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    function togglePw(){
      const inp = document.getElementById('password');
      const ic  = document.getElementById('eyeIcon');
      if(inp.type==='password'){inp.type='text';ic.className='ti ti-eye-off';}
      else{inp.type='password';ic.className='ti ti-eye';}
    }

    function showError(msg){
      document.getElementById('errorMsg').textContent = msg;
      document.getElementById('errorAlert').classList.add('show');
      document.getElementById('row1').classList.add('error');
      document.getElementById('row2').classList.add('error');
    }

    function clearError(){
      document.getElementById('errorAlert').classList.remove('show');
      document.getElementById('row1').classList.remove('error');
      document.getElementById('row2').classList.remove('error');
    }

    async function doLogin(){
      if(window.OnPartAudio) OnPartAudio.primeFromGesture();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      clearError();

      if(!username || !password){
        showError('لطفاً نام کاربری و رمز عبور را وارد کنید');
        return;
      }

      // Show loading
      const btn = document.getElementById('loginBtn');
      btn.classList.add('loading');
      btn.disabled = true;

      try {
        const data = await API.request('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({username, password})
        });
        if(!data.token || !data.user) throw new Error('پاسخ ورود نامعتبر است');
        if(data.user.role !== 'admin' && data.user.role !== 'partner') {
          throw new Error('این حساب اجازه ورود به پنل مدیریت را ندارد');
        }
        sessionStorage.setItem('op_token', data.token);
        sessionStorage.setItem('op_user', JSON.stringify(data.user));
        window.location.href = '/admin/';
        
      } catch(err){
        showError(err.message || 'خطا در ورود');
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    }

    // Check if already logged in as admin/partner
    if(sessionStorage.getItem('op_token')){
      try {
        const u = JSON.parse(sessionStorage.getItem('op_user')||'{}');
        if(u.role === 'admin' || u.role === 'partner'){
          window.location.replace('/admin/');
        } else {
          // Regular user - clear token, stay on login
          sessionStorage.removeItem('op_token');
          sessionStorage.removeItem('op_user');
        }
      } catch(e) {}
    }
  </script>
</body>
</html>
